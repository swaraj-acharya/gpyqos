function topicPicker(target, selected) {
  const idx = topicIndex();
  const sel = new Set(selected);
  const syl = activeSyllabus();
  const block = (sections, area) => sections.map(sec => `<div class="pk-sec" data-pk-sec><div class="grp">${esc(area === 'GA' ? 'GA · ' : '')}${esc(sec.name)}</div>${sec.groups.map(([g, items], gi) => items.map((name, ii) => {
    const id = `${sec.id}.${gi + 1}.${ii + 1}`;
    return `<label class="row small pk-item" data-pk-text="${esc((sec.name + ' ' + (g || '') + ' ' + name).toLowerCase())}" style="gap:6px;padding:2px 0"><input type="checkbox" data-topic-check="${esc(target)}" value="${id}" ${sel.has(id) ? 'checked' : ''}> ${g ? `<span class="muted">${esc(g)}:</span>` : ''} ${esc(name)}</label>`;
  }).join('')).join('')}</div>`).join('');
  return `<div class="stack" style="gap:6px;margin-top:6px">
    <div class="row" data-pk-chips="${esc(target)}">${selected.length ? selected.map(id => `<span class="tag" title="${esc(topicLabel(id))}">${esc(idx.byId[id]?.name || id)}</span>`).join('') : '<span class="small muted">None linked yet.</span>'}</div>
    <input type="search" data-pickfilter placeholder="Filter subtopics, e.g. thevenin, transformer, root locus" aria-label="Filter syllabus subtopics">
    <div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 10px">${block(syl.sections || [], 'EE')}${block(syl.ga || [], 'GA')}</div>
  </div>`;
}

/* ---------- the reusable prompt → reply box ---------- */
const TASK_DESC = {
  learn: 'Teaches the concept, prerequisites, formulas and a different example. It is told not to solve your question.',
  diagnose: 'Finds the earliest, most important gap in your attempt and names what to study next. No full solution.',
  theory: 'A focused lesson on just the gap the diagnosis found, not the whole chapter.',
  hint1: 'One gentle clue about where to begin. No method, no numbers, no answer.',
  hint2: 'Names the governing principle and at most one set-up step. Still no answer.',
  hint3: 'The complete, verified, step-by-step solution with traps and a check.',
  evaluate: 'Transcribes your handwritten working, gives a verdict and finds the first wrong step.',
  pattern: 'Teaches the whole family of questions: clues, method, traps and look-alikes. Saved as a pattern card.',
  variations: 'Fresh AI-generated practice questions, with all answers kept after the questions.',
  aptitude: 'One step: theory first, then a check of your handwritten working, the correct solution and the fastest exam method.',
};
function currentInteraction(q, task) {
  const st = UI.prompts[q.id + '|' + task];
  if (st && st.iid) { const i = q.interactions.find(x => x.id === st.iid); if (i) return i; }
  const drafts = interactionsOf(q, task).filter(i => !hasReply(i));
  return drafts[drafts.length - 1] || null;
}
function taskBox(q, task, { locked = '', extraLabel = 'Extra context for this prompt (optional)', extraPlaceholder = '' } = {}) {
  const key = q.id + '|' + task;
  const st = getUI(UI.prompts, key, { extra: '' });
  const inter = currentInteraction(q, task);
  const saved = interactionsOf(q, task).filter(hasReply);
  const just = UI.justSaved[key];
  const withMistake = ['diagnose', 'evaluate', 'aptitude'].includes(task);
  const draftMistake = inter ? (inter.mistakeType || '') : '';
  return `<section class="task" id="task-${task}" aria-labelledby="h-${task}">
    <div class="hd"><div><h3 id="h-${task}">${esc(TASKS[task].label)}</h3><p class="muted small" style="margin:2px 0 0">${esc(TASK_DESC[task])}</p></div>
      ${saved.length ? `<span class="pill l3">${plural(saved.length, 'saved reply', 'saved replies')}</span>` : ''}</div>
    <div class="bd stack">
      ${locked ? `<div class="note warn lock">${locked}</div>` : `
      <div class="note attach"><b>Attach in your AI chat:</b> ${ATTACH[task].map(esc).join(' + ')}${['evaluate', 'aptitude'].includes(task) ? ' <b>Both images are needed.</b>' : ''} Then paste the prompt. Continuing the same chat keeps the tutor’s context; the prompt still works in a fresh chat.</div>
      <label class="f">${esc(extraLabel)}<textarea rows="2" data-extra="${esc(key)}" placeholder="${esc(extraPlaceholder)}">${esc(st.extra)}</textarea></label>
      <div class="row">
        <button class="btn ${inter ? '' : 'primary big'}" data-act="gen" data-id="${esc(q.id)}" data-task="${task}">${inter ? 'Regenerate prompt' : 'Generate prompt'}</button>
        ${inter ? '' : `<span class="small muted">The prompt is saved to ${esc(q.id)} with this task.</span>`}
      </div>
      ${inter ? `
        <label class="f">Prompt — edit freely before copying<textarea class="prompt" id="prompt-${inter.id}" data-iprompt="${inter.id}" data-qid="${esc(q.id)}" rows="12">${esc(inter.prompt)}</textarea></label>
        <div class="row"><button class="btn primary big" data-act="copy" data-id="${esc(q.id)}" data-iid="${inter.id}">Copy prompt</button>${chatButtons(q)}</div>
        <div class="small" role="status" aria-live="polite" id="copymsg-${inter.id}"></div>
        <div class="sub stack">
          <label class="f">Paste the AI’s reply here<textarea rows="8" id="resp-${inter.id}" data-iresp="${inter.id}" data-qid="${esc(q.id)}" placeholder="Paste the whole reply. It is stored exactly as pasted.">${esc(inter.responseDraft || '')}</textarea></label>
          ${['evaluate', 'aptitude'].includes(task) ? `<label class="f">Verdict the tutor gave${selectEl(`data-iverdict="${inter.id}" data-qid="${esc(q.id)}"`, VERDICTS, inter.verdict || '', 'Choose the verdict')}</label>` : ''}
          <div class="grid2">
            ${withMistake ? `<label class="f">Main mistake type (optional)${selectEl(`data-imistake="${inter.id}" data-qid="${esc(q.id)}"`, MISTAKES.map(m => [m[0], m[1]]), draftMistake, 'None / not sure')}</label>` : ''}
            <label class="f">My takeaway in one line (optional)<input type="text" data-itake="${inter.id}" data-qid="${esc(q.id)}" value="${esc(inter.takeaway || '')}" placeholder="What will I do differently?"></label>
            ${['diagnose', 'theory', 'evaluate'].includes(task) ? `<label class="f">Follow-up action (optional)<input type="text" data-ifollow="${inter.id}" data-qid="${esc(q.id)}" value="${esc(inter.followUp || '')}" placeholder="e.g. revise phasor sign convention"></label>` : ''}
          </div>
          <div class="row"><button class="btn primary" data-act="saveReply" data-id="${esc(q.id)}" data-iid="${inter.id}">Save reply to ${esc(q.id)}</button><span class="small muted">Saving never replaces an earlier reply.</span></div>
        </div>` : ''}
      ${just ? `<div class="note" role="status">${just}</div>` : ''}`}
      ${saved.length ? `<div class="sub"><b class="small">Saved ${esc(TASKS[task].short.toLowerCase())} replies</b>${saved.slice().reverse().map((i, n) => interactionFold(q, i, n === 0 && !inter && task !== 'variations')).join('')}</div>` : ''}
    </div>
  </section>`;
}
function interactionFold(q, i, open) {
  const extras = [i.verdict ? `Verdict: ${VERDICT_LABEL[i.verdict]}` : '', i.mistakeType ? `Mistake: ${MISTAKE_LABEL[i.mistakeType]}` : ''].filter(Boolean).join(' · ');
  const editing = !!UI.editReply[i.id];
  const oldChat = safeUrl(i.chatUrl) && i.chatUrl !== q.chatUrl ? safeUrl(i.chatUrl) : '';
  const versions = Array.isArray(i.edits) ? i.edits : [];
  return `<details class="fold" ${open || editing ? 'open' : ''} style="margin-top:8px"><summary>${esc(TASKS[i.task]?.short || i.task)} — ${esc(fmtTime(i.savedAt || i.at))}${i.editedAt ? ` <span class="small muted" style="font-weight:400">(edited ${esc(fmtTime(i.editedAt))})</span>` : ''}${i.task === 'variations' ? ' <span class="small muted" style="font-weight:400">(includes answers — attempt first)</span>' : ''}${extras ? ` <span class="small muted" style="font-weight:400">${esc(extras)}</span>` : ''}</summary>
    ${editing ? replyEditor(q, i) : `
      ${i.takeaway ? `<p class="small" style="margin:6px 0"><b>Takeaway:</b> ${esc(i.takeaway)}</p>` : ''}
      ${i.followUp ? `<p class="small" style="margin:6px 0"><b>Follow-up:</b> ${esc(i.followUp)}</p>` : ''}
      <div class="reply-view">${renderReply(i.response)}</div>
      <div class="row" style="margin-top:6px"><button class="btn small" data-act="editReply" data-id="${esc(q.id)}" data-iid="${esc(i.id)}">Edit reply</button>${oldChat ? `<a class="btn ghost small" href="${esc(oldChat)}" target="_blank" rel="noopener">Open the chat this reply came from</a>` : ''}</div>`}
    ${versions.length ? `<details class="fold" style="margin-top:6px"><summary class="small">Earlier versions (${versions.length})</summary>${versions.map((v, idx) => ({ v, idx })).reverse().map(({ v, idx }) => `<div style="margin-top:8px"><div class="row"><span class="small muted" style="flex:1">Replaced on ${esc(fmtTime(v.at))}</span><button class="btn ghost small" data-act="restoreReply" data-id="${esc(q.id)}" data-iid="${esc(i.id)}" data-n="${idx}">Restore this version</button></div><div class="reply-view" style="max-height:240px">${renderReply(v.response)}</div></div>`).join('')}</details>` : ''}
    <details class="fold" style="margin-top:6px"><summary class="small">Prompt used</summary><pre class="reply-view mono" style="font-size:12px">${esc(i.prompt)}</pre></details>
  </details>`;
}

/* ---------- stage panels ---------- */
function stageLearn(q) {
  const learned = stageState(q, 'learn');
  const reply = latestReply(q, 'learn');
  const sugg = reply ? suggestTopics(reply, q.syllabusLinks) : [];
  return `<div class="stack">
    <p class="muted">Learn the main idea before your first attempt. The tutor is told to teach the concept and its prerequisites without solving your question.</p>
    ${q.relearn ? '<div class="note warn">Your last two revisions of this question failed or only recalled the final value, so start again from the concept. Your earlier work is all kept.</div>' : ''}
    ${taskBox(q, 'learn', { extraPlaceholder: 'e.g. I have never studied two-port networks' })}
    ${sugg.length ? `<div class="note"><b class="small">Syllabus subtopics mentioned in the lesson — link them?</b><div class="row" style="margin-top:6px">${sugg.map(id => `<button class="chip" data-act="linkTopic" data-id="${esc(q.id)}" data-topic="${id}" title="${esc(topicLabel(id))}">+ ${esc(topicIndex().byId[id].name)}</button>`).join('')}</div></div>` : ''}
    <div class="row"><button class="btn ${reply ? 'primary' : ''}" data-act="learnDone" data-id="${esc(q.id)}">I’ve learned the basics — attempt it</button>${!reply ? '<span class="small muted">You can also continue without saving the lesson.</span>' : ''}</div>
  </div>`;
}

function attemptForm(q, mode) {
  const d = getUI(UI.attempt, q.id + '|' + mode, () => ({ kind: mode === 'retry' ? 'retry' : suggestAttemptKind(q), outcome: '', minutes: '', notes: '' }));
  const running = !!q.timerStart;
  const preview = d.outcome ? classifyAttempt(q, d.kind, d.outcome, dayKey()) : null;
  return `<div class="task"><div class="hd"><div><h3>${mode === 'retry' ? 'Solve again from scratch' : 'Attempt it on paper'}</h3>
    <p class="muted small" style="margin:2px 0 0">${mode === 'retry' ? 'Close every lesson, hint and solution. Start from a blank page.' : 'Close the lesson. Open your question screenshot and solve it on paper without help.'}</p></div></div>
    <div class="bd stack">
      <div class="row">
        ${running ? `<span class="timer" data-timer-start="${esc(q.timerStart)}" aria-live="off">00:00</span><button class="btn" data-act="stopTimer" data-id="${esc(q.id)}" data-mode="${mode}">Stop timer</button>` : `<button class="btn" data-act="startTimer" data-id="${esc(q.id)}">Start timer</button><span class="small muted">or work untimed</span>`}
      </div>
      <label class="f">This attempt was${selectEl(`data-ab="${esc(q.id)}|${mode}|kind"`, ATTEMPT_KINDS, d.kind)}</label>
      <div><b class="small">Outcome</b>${choiceRow('Outcome', OUTCOMES, d.outcome, `${q.id}|${mode}|outcome`)}</div>
      <div class="grid2">
        <label class="f">Minutes (optional)<input type="number" min="0" data-ab="${esc(q.id)}|${mode}|minutes" value="${esc(d.minutes)}"></label>
        <span></span>
      </div>
      <label class="f">Where did you get stuck? (optional — goes into the diagnosis and hint prompts)<textarea rows="3" data-ab="${esc(q.id)}|${mode}|notes" placeholder="e.g. Found Vth but didn't know what to do with the dependent source">${esc(d.notes)}</textarea></label>
      ${preview ? `<div class="note small">This will be recorded as: <b>${esc(preview.label)}</b>${preview.indep ? ' — counts as independent.' : '.'}</div>` : ''}
      <div class="row"><button class="btn primary" data-act="saveAttempt" data-id="${esc(q.id)}" data-mode="${mode}" ${d.outcome ? '' : 'disabled'}>Save attempt</button></div>
    </div></div>`;
}
function attemptList(q) {
  if (!q.attempts.length) return '';
  return `<div class="panel"><h3>Attempts</h3><ul class="timeline">${q.attempts.slice().reverse().map(a => `<li><span class="when">${esc(fmtTime(a.at))}${a.minutes ? ` · ${a.minutes} min` : ''}</span><div><b>${esc(a.label)}</b> ${a.indep && isSolved(a) ? '<span class="pill l3">independent</span>' : ''}</div>${a.notes ? `<div class="small muted" style="white-space:pre-wrap">${esc(a.notes)}</div>` : ''}</li>`).join('')}</ul></div>`;
}
function stageAttempt(q) {
  const last = lastAttempt(q);
  const learned = stageState(q, 'learn');
  const needDiag = last && !isSolved(last);
  return `<div class="stack">
    ${!learned ? `<div class="note warn">The concept lesson comes first, so your attempt is meaningful. <button class="btn small" data-act="stage" data-id="${esc(q.id)}" data-stage="learn">Go to Learn concept</button> or <button class="btn small ghost" data-act="learnDone" data-id="${esc(q.id)}" data-stay="1">I already know it</button></div>` : ''}
    ${attemptForm(q, 'attempt')}
    ${last && isSolved(last) && last.indep ? `<div class="note">Solved on your own. Hints aren’t needed. Next, have your handwritten working checked. <button class="btn small" data-act="stage" data-id="${esc(q.id)}" data-stage="evaluate">Evaluate solution</button></div>` : ''}
    ${needDiag || interactionsOf(q, 'diagnose').length ? taskBox(q, 'diagnose', { extraLabel: 'Anything else about your attempt (optional)', extraPlaceholder: 'e.g. I got 4.2 A but the key says 3.6 A' }) : (q.attempts.length ? '' : '<p class="small muted">If the attempt doesn’t work out, a diagnosis prompt appears here.</p>')}
    ${needDiag && interactionsOf(q, 'diagnose').some(hasReply) ? `<div class="row"><button class="btn primary" data-act="goHelp" data-id="${esc(q.id)}" data-tab="theory">Learn the missing theory</button><button class="btn" data-act="goHelp" data-id="${esc(q.id)}" data-tab="hint1">Go to hints</button></div>` : ''}
    ${attemptList(q)}
  </div>`;
}

function stageHelp(q) {
  const tabs = [['theory', 'Missing theory'], ['hint1', 'Hint 1'], ['hint2', 'Hint 2'], ['hint3', 'Hint 3 · solution'], ['retry', 'Solve again']];
  const def = nextAction(q).tab || (usedTask(q, 'theory') ? 'retry' : 'theory');
  const tab = UI.helpTab[q.id] || def;
  let body = '';
  if (tab === 'theory') body = taskBox(q, 'theory', { extraLabel: 'The gap in your own words (optional)', extraPlaceholder: interactionsOf(q, 'diagnose').some(hasReply) ? 'The saved diagnosis is included automatically.' : 'e.g. I don’t understand why the current source becomes an open circuit' });
  if (tab === 'hint1') body = taskBox(q, 'hint1', { extraLabel: 'Where are you stuck right now? (optional)' });
  if (tab === 'hint2') body = taskBox(q, 'hint2', { locked: usedTask(q, 'hint1') ? '' : 'Hints come in order. Use Hint 1 first (copy its prompt or save its reply); Hint 2 unlocks after that.', extraLabel: 'What did you try after Hint 1? (optional)' });
  if (tab === 'hint3') body = taskBox(q, 'hint3', { locked: usedTask(q, 'hint2') ? '' : 'Hint 3 shows the full solution, so it unlocks only after Hint 2. Struggling a little longer is where the learning happens.' }) + (usedTask(q, 'hint3') ? '<div class="note small">You have seen the full solution. A solve today counts as assisted; retry from scratch on a later study day for it to count as independent.</div>' : '');
  if (tab === 'retry') body = attemptForm(q, 'retry') + attemptList(q);
  return `<div class="stack">
    <p class="muted">Use only what you need. Hints are optional and come in order; skip straight to “Solve again” if the theory unlocked it.</p>
    <div class="row"><div class="seg" role="group" aria-label="Help options">${tabs.map(([k, l]) => `<button data-act="helpTab" data-id="${esc(q.id)}" data-tab="${k}" aria-pressed="${tab === k}">${esc(l)}${['hint1', 'hint2', 'hint3', 'theory'].includes(k) && usedTask(q, k) ? ' ✓' : ''}</button>`).join('')}</div>
    ${stageState(q, 'help') ? '' : `<button class="btn ghost small" data-act="skipHelp" data-id="${esc(q.id)}">I don’t need help here</button>`}</div>
    ${body}
  </div>`;
}

/* ---------- General Aptitude: one step ---------- */

function stageEvaluate(q) {
  return `<div class="stack">
    <p class="muted">Photograph your handwritten working. In your AI chat attach the question screenshot <b>and</b> the photo, then paste this prompt.</p>
    ${!q.attempts.length ? '<div class="note warn">Evaluation reviews your own working, so record an attempt first.</div>' : ''}
    ${taskBox(q, 'evaluate', { extraLabel: 'What should the evaluator focus on? (optional)', extraPlaceholder: 'e.g. I’m unsure about my sign convention in step 3' })}
    ${!stageState(q, 'evaluate') ? `<div class="row"><button class="btn ghost small" data-act="skipEvaluate" data-id="${esc(q.id)}">Skip evaluation for this question</button></div>` : ''}

function gate(q, what) {

}

  return `<div class="stack">

function stageVariations(q) {
  const g = gate(q, 'variations'); if (g) return g;
  const replies = interactionsOf(q, 'variations').filter(hasReply);
  const latest = replies[replies.length - 1];
  const parsedNew = latest && !q.variations.some(v => v.fromInteraction === latest.id);
  const VSTAT = [['not-tried', 'Not tried'], ['solved', 'Solved on my own'], ['helped', 'Solved with help'], ['failed', 'Couldn’t solve']];
  return `<div class="stack">
    <p class="muted">Fresh questions test whether the method transfers. Attempt each one before opening the answers.</p>

      ${q.variations.length ? q.variations.map(v => {
        const src = v.fromInteraction ? q.interactions.find(i => i.id === v.fromInteraction) : null;

        return `<div style="border-top:1px solid var(--line);padding:12px 0">

    </div>

}

function timelineItems(q) {
  const items = [];
  q.interactions.filter(hasReply).forEach(i => items.push({ at: i.savedAt || i.at, html: interactionFold(q, i, false) }));
  q.interactions.filter(i => !hasReply(i) && i.used).forEach(i => items.push({ at: i.usedAt || i.at, html: `<div><b>${esc(TASKS[i.task].short)}</b> prompt copied (no reply saved)</div>` }));
  q.attempts.forEach(a => items.push({ at: a.at, html: `<div><b>Attempt:</b> ${esc(a.label)}${a.minutes ? ` (${a.minutes} min)` : ''}</div>${a.notes ? `<div class="small muted" style="white-space:pre-wrap">${esc(a.notes)}</div>` : ''}` }));
  q.revision.history.forEach(h => items.push({ at: h.at, html: `<div><b>Revision:</b> ${esc(REV_RESULT[h.result] || h.result)} ${h.counts ? '<span class="pill l4">delayed recall</span>' : ''}</div><div class="small muted">Method ${esc(h.method || '—')}, reasoning ${esc(h.reason || '—')}${h.forgotten ? `; forgot: ${esc(h.forgotten)}` : ''}. Next gap ${h.gapDays} days.</div>` }));
  q.mistakes.forEach(m => items.push({ at: m.at, html: `<div><b>Mistake logged:</b> ${esc(MISTAKE_LABEL[m.type] || m.type)}${m.note ? ` — ${esc(m.note)}` : ''}</div>` }));
  return items.sort((a, b) => b.at.localeCompare(a.at));
}

/* ---------------------------------------------------------------------
   PYQ Tracker — the ExamDost portal's Subject › Topic › Sub-topic table,
   with your own Added / Attempted / Solved counts and a one-tap Add.
   --------------------------------------------------------------------- */
function pyqStats() {
  const m = {};
  const bump = (k, q) => {
    const e = m[k] || (m[k] = { added: 0, attempted: 0, solved: 0 });
    e.added++;
    if (q.attempts.length) e.attempted++;
    if (q.attempts.some(isSolved)) e.solved++;
  };
  for (const q of qList()) {
    const p = pyqPath(q); if (!p.length) continue;
    bump('ALL', q);
    for (let i = 1; i <= p.length; i++) bump(pyqKey(...p.slice(0, i)), q);
  }
  return k => m[k] || { added: 0, attempted: 0, solved: 0 };
}
function viewPYQ() {
  const st = pyqStats(), all = st('ALL');
  const open = k => UI.openSections['pyq:' + k] ? 'open' : '';
  const cells = (key, n) => {
    const e = st(key);
    return `<span class="n">${n}</span>
      <span class="n">${e.added ? `<a href="#/q?pyq=${encodeURIComponent(key)}" title="Show these questions">${e.added}</a>` : '<span class="z">0</span>'}</span>
      <span class="n">${e.attempted || '<span class="z">0</span>'}</span>
      <span class="n">${e.solved ? `<b class="ok">${e.solved}</b>` : '<span class="z">0</span>'}</span>`;
  };
  const add = (s, t = '', u = '') => `<button class="btn small pyq-add" data-act="newQuestion" data-s="${esc(s)}" data-t="${esc(t)}" data-u="${esc(u)}" aria-label="Add a question to ${esc(pyqKey(s, t, u))}">+ Add</button>`;
  const bar = (key, n) => { const e = st(key); return `<span class="meter pyq-meter" aria-hidden="true"><i style="width:${n ? Math.min(100, (e.attempted / n) * 100) : 0}%;background:var(--blue)"></i></span>`; };
  const subjects = PORTAL.map(([s, n, topics]) => `
    <details class="pyq-subj" data-sec="pyq:${esc(s)}" ${open(s)}>
      <summary class="pyq-row lvl0"><span class="nm"><span class="tw" aria-hidden="true"></span>${esc(s)}${bar(s, n)}</span>${cells(s, n)}<span class="act">${add(s)}</span></summary>
      <div class="pyq-topics">
        ${topics.map(([t, tn, subs]) => { const k = pyqKey(s, t); return `
        <details class="pyq-topic" data-sec="pyq:${esc(k)}" ${open(k)}>
          <summary class="pyq-row lvl1"><span class="nm"><span class="tw" aria-hidden="true"></span>${esc(t)} <span class="cnt">${plural(subs.length, 'sub-topic')}</span></span>${cells(k, tn)}<span class="act">${add(s, t, subs.length === 1 ? subs[0][0] : '')}</span></summary>
          <div class="pyq-subs">
            ${subs.map(([u, un]) => { const k2 = pyqKey(s, t, u); return `<div class="pyq-row lvl2"><span class="nm">${esc(u)}</span>${cells(k2, un)}<span class="act">${add(s, t, u)}</span></div>`; }).join('')}
          </div>
        </details>`; }).join('')}
      </div>
    </details>`).join('');
  return `
  <div class="page-head">
    <div><h1>PYQ Tracker</h1><p>Same Subject › Topic › Sub-topic layout as the ${esc(PORTAL_NAME)} portal. Press <b>+ Add</b> on the row you are practising, and the question form opens with that sub-topic already picked. Saving takes you straight to the question in the workspace.</p></div>
    <div class="row"><button class="btn" data-act="pyqFold" data-open="">Collapse all</button><button class="btn" data-act="pyqFold" data-open="1">Expand all</button><button class="btn primary big" data-act="newQuestion">Add PYQ</button></div>
  </div>
  <div class="pyq-sum">
    <div><span class="lbl">Total questions</span><span class="v">${PORTAL_TOTAL}</span></div>
    <div><span class="lbl">Added here</span><span class="v">${all.added}</span></div>
    <div><span class="lbl">Attempted</span><span class="v">${all.attempted}</span></div>
    <div><span class="lbl">% attempted</span><span class="v">${pct(all.attempted, PORTAL_TOTAL)}</span></div>
    <div><span class="lbl">Solved</span><span class="v">${all.solved}</span></div>
  </div>
  <div class="scroll-x"><div class="pyq">
    <div class="pyq-row pyq-head"><span>Topic</span><span class="n">Questions</span><span class="n">Added</span><span class="n">Attempted</span><span class="n">Solved</span><span></span></div>
    ${subjects}
  </div></div>
  <p class="small muted" style="margin-top:10px">Questions = the portal’s count. Added = questions you saved here. Attempted = at least one attempt logged. Solved = at least one attempt marked “Solved it”.</p>`;
}

  if (t && t[2].length === 1) qa.subtopic = t[2][0][0];
  return qa;
}
function qaDefaults(pre = {}) {

  const qa = { find: '', subject: last.subject || '', topic: last.topic || '', subtopic: last.subtopic || '', year: '', set: '', qno: '', qType: '', marks: '', answer: '', note: '' };
  if (pre.subject) Object.assign(qa, { subject: pre.subject, topic: pre.topic || '', subtopic: pre.subtopic || '' });

function qaFindResults() {
  const f = (UI.qa?.find || '').trim().toLowerCase();

  const words = f.split(/\s+/);
  const hits = PORTAL_FLAT.filter(x => { const h = (x.subtopic + ' ' + x.topic + ' ' + x.subject).toLowerCase(); return words.every(w => h.includes(w)); })
    .sort((a, b) => (b.subtopic.toLowerCase().includes(words[0]) - a.subtopic.toLowerCase().includes(words[0])))
    .slice(0, 8);
  if (!hits.length) return '<p class="small muted">No sub-topic matches.</p>';
  return hits.map((x, i) => `<button type="button" class="qa-hit" data-act="qaPick" data-s="${esc(x.subject)}" data-t="${esc(x.topic)}" data-u="${esc(x.subtopic)}">${i === 0 ? '<span class="kbd">Enter</span>' : ''}<b>${esc(x.subtopic)}</b><span class="muted small">${esc(x.subject)} › ${esc(x.topic)}</span></button>`).join('');
}
function qaDuplicate() {
  const qa = UI.qa; const y = parseInt(qa.year, 10); const n = String(qa.qno || '').trim().replace(/^q/i, '');

function qaSave(openAfter) {

    pyq: { subject: qa.subject, topic: qa.topic, subtopic: qa.subtopic },

  });

  const filt = UI.sylFilter;
  const all = topicIndex().list.filter(t => t.area === area);
  const counts = TOPIC_STATES.map(s => all.filter(t => stats[t.id].state === s.n).length);
  const total = all.length || 1;
  const keep = t => {
    const m = stats[t.id];
    if (filt === 'not') return m.state === 0;
    if (filt === 'attention') return m.flags.length || m.state === 5;
    if (filt === 'progress') return m.state > 0 && m.state < 6;
    return true;
  };
  return `
  <div class="page-head">
    <div><h1>Syllabus Map</h1><p>PYQs decide how you learn; the official syllabus decides what you must cover. Status comes only from the questions you link to each subtopic, never from reading a lesson alone.</p></div>
    <div class="seg" role="group" aria-label="Syllabus">${[['EE', 'Electrical Engineering'], ['GA', 'General Aptitude']].map(([k, l]) => `<button data-act="sylArea" data-v="${k}" aria-pressed="${area === k}">${l}</button>`).join('')}</div>
  </div>
  <div class="panel">
    <div class="meter" role="img" aria-label="${TOPIC_STATES.map((s, i) => `${s.label}: ${counts[i]}`).join(', ')}">${TOPIC_STATES.map((s, i) => counts[i] ? `<i class="st-${s.n}" style="width:${(counts[i] / total) * 100}%" title="${esc(s.label)}: ${counts[i]}"></i>` : '').join('')}</div>
    <div class="legend" style="margin-top:10px">${TOPIC_STATES.map((s, i) => `<span><i class="st-${s.n}"></i>${esc(s.label)} ${counts[i]}</span>`).join('')}</div>
    <p class="small muted" style="margin-top:10px">Strong = 2+ linked questions solved independently and 1+ recalled after a delay. Needs revision = a linked question is overdue or its latest revision failed. Source: <a href="${esc(syl.source || '#')}" target="_blank" rel="noopener">${esc(syl.title)}</a>, retrieved ${esc(syl.retrieved || '—')}${S.syllabusOverride ? ' (your replacement syllabus)' : ''}.</p>
    <div class="row" style="margin-top:6px"><span class="small">Show</span><span style="width:min(100%,340px)">${selectEl('id="sylFilter" aria-label="Filter subtopics"', [['all', 'All subtopics'], ['not', 'Not started'], ['progress', 'In progress'], ['attention', 'Needs attention (gaps, failed revisions)']], filt)}</span></div>
  </div>
  <div style="margin-top:14px">
  ${sections.map(sec => {
    const ts = all.filter(t => t.sectionId === sec.id);
    const shown = ts.filter(keep);
    if (!shown.length && filt !== 'all') return '';
    const c = TOPIC_STATES.map(s => ts.filter(t => stats[t.id].state === s.n).length);
    const linkedQs = new Set(ts.flatMap(t => stats[t.id].qs.map(q => q.id))).size;
    const open = UI.openSections[sec.id] || filt !== 'all';
    let lastGroup = undefined;
    return `<details class="sec" data-sec="${esc(sec.id)}" ${open ? 'open' : ''}>
      <summary><div><b>${esc(sec.name)}</b><div class="small muted">${plural(ts.length, 'subtopic')}, ${plural(linkedQs, 'linked question')}, ${c[0]} not started</div></div>
        <div class="meter" aria-hidden="true">${TOPIC_STATES.map((s, i) => c[i] ? `<i class="st-${s.n}" style="width:${(c[i] / ts.length) * 100}%"></i>` : '').join('')}</div>
        <span class="small muted">${c[6]} strong</span></summary>
      <div class="body">${shown.map(t => {
        const m = stats[t.id];
        const gh = t.group !== lastGroup && t.group ? `<div class="grp">${esc(t.group)}</div>` : '';
        lastGroup = t.group;
        const theory = !!(S.topicNotes[t.id] || {}).theory;
        return `${gh}<div class="topic"><div><div class="nm">${esc(t.name)}</div>
            <div class="flags"><span class="pill ${m.state === 6 ? 'l4' : m.state === 5 ? 'bad' : m.state === 4 ? 'l3' : m.state ? 'l1' : 'l0'}" title="${esc(m.why)}">${esc(TOPIC_STATES[m.state].label)}</span>${m.flags.map(f => `<span class="pill ${f[0]}">${esc(f[1])}</span>`).join('')}${!m.qs.length && m.state === 1 ? '<span class="pill l2" title="Studying foundation theory before any PYQ is linked. Add a question to get evidence.">no question yet</span>' : ''}</div></div>
          <div class="row">
            ${m.qs.length ? `<a class="btn small" href="#/q?topic=${encodeURIComponent(t.id)}">${plural(m.qs.length, 'question')}</a>` : ''}
            <label class="row small" style="gap:4px"><input type="checkbox" data-theory="${esc(t.id)}" ${theory ? 'checked' : ''}> studying theory</label>
          </div></div>`;
      }).join('') || '<p class="small muted">Nothing matches this filter here.</p>'}</div>
    </details>`;
  }).join('')}
  </div>`;
}

/* ---------------------------------------------------------------------
   Pattern library
   --------------------------------------------------------------------- */
const PFIELDS = [
  ['archetype', 'Question archetype'], ['clues', 'Recognition clues'], ['principle', 'Governing principle'], ['procedure', 'Reusable method'],
  ['assumptions', 'Assumptions'], ['limitations', 'Limitations'], ['traps', 'Common traps'], ['similar', 'Similar but different patterns'],
  ['changes', 'When the method changes'], ['variations', 'Useful variations'], ['syllabusText', 'Syllabus links (from the reply)'],
];
function viewPatterns() {
  const s = UI.patSearch.trim().toLowerCase();
  const sec = UI.patSection;
  const ps = Object.values(S.patterns).filter(p => {
    const qs = patternQuestions(p.id);
    const links = new Set([...p.syllabusLinks, ...qs.flatMap(q => q.syllabusLinks)]);
    if (sec && ![...links].some(id => id.startsWith(sec + '.'))) return false;
    if (!s) return true;
    const hay = [p.id, p.name, p.hook, ...PFIELDS.map(([k]) => p[k]), ...qs.map(q => q.id + ' ' + q.title)].join(' ').toLowerCase();
    return s.split(/\s+/).every(w => hay.includes(w));
  }).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  const openId = UI.route.id;
  return `
  <div class="page-head">
    <div><h1>Pattern Library</h1><p>Every card here was saved from a question. In the exam you won’t have time to invent a method: read the question, spot the pattern, then fill in the details.</p></div>
    <button class="btn" data-act="newPattern">Blank pattern card</button>
  </div>
  <div class="row" style="margin-bottom:12px">
    <input type="search" id="patSearch" value="${esc(UI.patSearch)}" placeholder="Search clues, methods, traps, questions" style="flex:2;min-width:220px" aria-label="Search patterns">
    <span style="flex:1;min-width:200px">${selectEl('id="patSection" aria-label="Filter by syllabus section"', (activeSyllabus().sections || []).map(x => [x.id, x.name]), sec, 'All syllabus sections')}</span>
  </div>
  ${ps.length ? ps.map(p => {
    const qs = patternQuestions(p.id);
    return `<details class="pcard" id="pat-${esc(p.id)}" ${openId === p.id ? 'open' : ''}>
      <summary><b>${esc(p.name || 'Unnamed pattern')}</b><span class="qid">${esc(p.id)}</span><span class="small muted">${plural(qs.length, 'question')}</span>${p.hook ? `<span class="hook">${esc(p.hook)}</span>` : ''}</summary>
      <div class="body">
        ${PFIELDS.filter(([k]) => p[k]).map(([k, l]) => `<div class="pfield"><h4>${esc(l)}</h4><div>${esc(p[k])}</div></div>`).join('')}
        ${p.syllabusLinks.length ? `<div class="pfield"><h4>Official syllabus subtopics</h4><div>${p.syllabusLinks.map(id => `<span class="tag">${esc(topicLabel(id))}</span>`).join(' ')}</div></div>` : ''}
        <div class="pfield"><h4>Linked questions</h4><div>${qs.length ? qs.map(q => `<a href="${qLink(q.id)}">${esc(q.id)}</a> ${esc(qName(q))} ${levelPill(q)}`).join('<br>') : 'None'}</div></div>
        <div class="row" style="margin-top:12px"><button class="btn small" data-act="editPattern" data-pid="${esc(p.id)}">Edit</button><span class="spacer"></span><button class="btn danger small" data-act="deletePattern" data-pid="${esc(p.id)}">Delete card</button></div>
      </div>
    </details>`;
  }).join('') : `<div class="panel empty"><h3>${Object.keys(S.patterns).length ? 'No pattern matches' : 'No patterns yet'}</h3><p>${Object.keys(S.patterns).length ? 'Try a different search or section.' : 'Open a question you have attempted, go to “Recognise pattern”, save the tutor’s reply, then create a card from it.'}</p></div>`}`;
}

function patternEditor(p, forQ) {
  const draft = { ...p };
  UI.patternDraft = { id: p.id || null, forQ: forQ || null, links: [...(p.syllabusLinks || [])] };
  openModal(p.id ? `Edit ${p.id}` : 'New pattern card', `
    <div class="stack">
      <label class="f">Pattern name<input type="text" id="pf-name" value="${esc(draft.name)}" placeholder="Specific, e.g. Thevenin with a dependent source"></label>
      <label class="f">Memory hook — “When I see ___, check ___ because ___.”<input type="text" id="pf-hook" value="${esc(draft.hook)}"></label>
      ${PFIELDS.map(([k, l]) => `<label class="f">${esc(l)}<textarea id="pf-${k}" rows="${['clues', 'procedure', 'traps'].includes(k) ? 4 : 2}">${esc(draft[k] || '')}</textarea></label>`).join('')}
      <div><b class="small">Official syllabus subtopics</b>${topicPicker('pattern', UI.patternDraft.links)}</div>
      ${forQ ? `<p class="small muted">This card will be linked to ${esc(forQ)}.</p>` : ''}
    </div>`, `<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="savePattern">Save pattern card</button>`);
}

/* ---------------------------------------------------------------------
   Revision
   --------------------------------------------------------------------- */
function viewRevision() {
  if (UI.route.id) return viewReviewSession(UI.route.id);
  const today = dayKey();
  const qs = qList();
  const due = qs.filter(isDue).sort((a, b) => a.revision.nextReviewAt.localeCompare(b.revision.nextReviewAt));
  const soon = qs.filter(q => q.revision.nextReviewAt && q.revision.nextReviewAt > today && daysBetween(today, q.revision.nextReviewAt) <= 14).sort((a, b) => a.revision.nextReviewAt.localeCompare(b.revision.nextReviewAt));
  const unscheduled = qs.filter(q => !q.revision.nextReviewAt && q.attempts.length);
  const row = q => `<li class="row"><span class="qid">${esc(q.id)}</span><span style="flex:1;min-width:0">${esc(qName(q))} <span class="small muted">${esc(relDay(q.revision.nextReviewAt))}</span></span>${levelPill(q)}${q.relearn ? '<span class="pill bad">relearn</span>' : ''}<a class="btn small ${isDue(q) ? 'primary' : ''}" href="#/revision/${esc(q.id)}">Revise</a></li>`;
  return `
  <div class="page-head">
    <div><h1>Revision</h1><p>Solve each question again on paper before looking at anything you saved. Results move the next review further away, or bring it back sooner.</p></div>
    ${due.length ? `<a class="btn primary big" href="#/revision/${esc(due[0].id)}">Start next review</a>` : ''}
  </div>
  <div class="panel continue"><h2>Due now (${due.length})</h2>${due.length ? `<ul>${due.map(row).join('')}</ul>` : '<p class="muted">Nothing is due. Revisions appear here on their study day (the day starts at ' + pad(S.settings.dayStartHour) + ':00).</p>'}</div>
  <div class="panel continue"><h2>Next 14 days (${soon.length})</h2>${soon.length ? `<ul>${soon.map(row).join('')}</ul>` : '<p class="muted small">Nothing scheduled in the next two weeks.</p>'}</div>
  ${unscheduled.length ? `<div class="panel continue"><h2>Attempted but not scheduled (${unscheduled.length})</h2><ul>${unscheduled.map(q => `<li class="row"><span class="qid">${esc(q.id)}</span><span style="flex:1">${esc(qName(q))}</span><button class="btn small" data-act="schedule" data-id="${esc(q.id)}">Schedule</button></li>`).join('')}</ul></div>` : ''}
  <p class="small muted">Ladder: ${S.settings.intervals.join(', ')} days, then every ${S.settings.maintenanceDays} days. A full independent solve moves one step up; “hard” shortens the gap; needing to peek halves it; recalling only the final value steps back; failing restarts at day 1. These are practical defaults, not proven-optimal intervals; change them in Settings.</p>`;
}

function viewReviewSession(id) {
  const q = getQ(id);
  if (!q) return `<div class="panel"><h2>${esc(id)} doesn’t exist</h2><a class="btn" href="#/revision">Back to revision</a></div>`;
  const d = getUI(UI.review, q.id, () => ({ result: '', method: '', reason: '', felt: 'ok', forgotten: '', mistakes: '', compare: '', revealed: false, saved: null }));
  const yn = [['yes', 'Yes'], ['partly', 'Partly'], ['no', 'No']];
  const results = [['independent', 'Solved it on my own, full working'], ['answer-only', 'Remembered the final value, couldn’t derive it'], ['peeked', 'Needed to peek at notes or a hint'], ['failed', 'Couldn’t solve it']];
  const disabled = new Set(d.revealed && !d.saved ? ['independent'] : []);
  const evalReply = latestReply(q, 'hint3') || latestReply(q, 'evaluate') || latestReply(q, 'aptitude');
  const pats = q.patternIds.map(pid => S.patterns[pid]).filter(Boolean);
  return `
  <a class="btn ghost small" href="#/revision">All revisions</a>
  <div class="page-head" style="margin-top:6px"><div><div class="row"><span class="qid">${esc(q.id)}</span>${levelPill(q)}${isDue(q) ? '<span class="pill due">due</span>' : `<span class="pill">${esc(relDay(q.revision.nextReviewAt))}</span>`}</div><h1>${esc(qName(q))}</h1></div>
  <a class="btn small" href="${qLink(q.id, 'history')}">Open workspace</a></div>
  <div class="panel stack">
    <h2>1. Solve it again, before looking at anything</h2>
    <div class="note attach">Open your screenshot of this question${sourceLine(q) ? ` (${esc(sourceLine(q))})` : ''}. Solve it on paper from a blank page.</div>
    ${q.statement ? `<p><b>Your note of the question:</b> ${esc(q.statement)}</p>` : '<p class="small muted">No typed note of the question is saved, so use your screenshot. You can add a one-line note under Details in the workspace.</p>'}
    <div class="row">${q.timerStart ? `<span class="timer" data-timer-start="${esc(q.timerStart)}">00:00</span><button class="btn" data-act="stopTimer" data-id="${esc(q.id)}" data-mode="review">Stop timer</button>` : `<button class="btn" data-act="startTimer" data-id="${esc(q.id)}">Start timer</button>`}</div>
  </div>
  <div class="panel stack">
    <h2>2. Record what happened</h2>
    ${d.revealed && !d.saved ? '<div class="note warn small">You revealed your saved learning before recording, so this review can’t count as independent recall.</div>' : ''}
    <div><b class="small">Result</b>${choiceRow('Result', results, d.result, `rev|${q.id}|result`, disabled)}</div>
    <div class="grid2">
      <div><b class="small">Could you reproduce the method?</b>${choiceRow('Method', yn, d.method, `rev|${q.id}|method`)}</div>
      <div><b class="small">Could you explain why each step works?</b>${choiceRow('Reasoning', yn, d.reason, `rev|${q.id}|reason`)}</div>
    </div>
    <div><b class="small">How did it feel?</b>${choiceRow('Difficulty', [['easy', 'Easy'], ['ok', 'OK'], ['hard', 'Hard']], d.felt, `rev|${q.id}|felt`)}</div>
    <div class="grid2">
      <label class="f">Concepts you had forgotten<textarea rows="2" data-rb="${esc(q.id)}|forgotten">${esc(d.forgotten)}</textarea></label>
      <label class="f">Mistakes this time<textarea rows="2" data-rb="${esc(q.id)}|mistakes">${esc(d.mistakes)}</textarea></label>
    </div>
    ${d.saved ? `<div class="note" role="status"><b>Saved.</b> Next review ${esc(fmtDay(d.saved.next))} (${d.saved.gap} days). ${d.saved.counts ? 'Counted as delayed independent recall.' : `Not counted as delayed recall${d.saved.why ? ': ' + esc(d.saved.why) : ''}.`}${q.relearn ? ` <b>Two weak revisions in a row — go back to the concept.</b> <a class="btn small" href="${qLink(q.id, 'learn')}">Relearn the concept</a>` : ''}</div>` :
      `<div class="row"><button class="btn primary" data-act="saveReview" data-id="${esc(q.id)}" ${d.result && d.method && d.reason ? '' : 'disabled'}>Save revision result</button><span class="small muted">Result, method and reasoning are needed.</span></div>`}
  </div>
  <div class="panel stack">
    <h2>3. Compare with your saved learning</h2>
    ${d.revealed ? `
      ${q.takeaway ? `<div class="pfield"><h4>Key takeaway</h4><div>${esc(q.takeaway)}</div></div>` : ''}
      ${q.formulas ? `<div class="pfield"><h4>Formulas and theory notes</h4><div>${esc(q.formulas)}</div></div>` : ''}
      ${pats.map(p => `<div class="pfield"><h4>Pattern: ${esc(p.name)}</h4><div>${esc(p.hook || '')}\n${esc(p.procedure || '')}</div></div>`).join('')}
      ${q.mistakes.length ? `<div class="pfield"><h4>Past mistakes</h4><div>${q.mistakes.map(m => esc(MISTAKE_LABEL[m.type] + (m.note ? ' — ' + m.note : ''))).join('\n')}</div></div>` : ''}
      ${evalReply ? `<details class="fold"><summary>Saved solution / evaluation</summary><div class="reply-view">${renderReply(evalReply)}</div></details>` : ''}
      ${!q.takeaway && !q.formulas && !pats.length && !evalReply ? '<p class="muted small">Nothing saved yet for this question.</p>' : ''}
      <label class="f">What differed between today’s attempt and your saved learning?<textarea rows="2" data-rb="${esc(q.id)}|compare">${esc(d.compare)}</textarea></label>
      ${d.saved ? `<div class="row"><button class="btn small" data-act="saveCompare" data-id="${esc(q.id)}">Save comparison note</button></div>` : ''}
    ` : `<p class="muted">Hidden so it can’t prompt your memory. ${d.saved ? '' : 'Record your result first for it to count as independent recall.'}</p><button class="btn" data-act="reveal" data-id="${esc(q.id)}">Reveal saved learning</button>`}
  </div>`;
}

/* ---------------------------------------------------------------------
   Modal, toast
   --------------------------------------------------------------------- */
function openModal(title, body, foot) {
  const dlg = $('#modal');
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modalFoot').innerHTML = foot;
  if (!dlg.open) { if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', ''); }
}
function closeModal() { const dlg = $('#modal'); if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); } }
function toast(msg, err = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.setAttribute('role', err ? 'alert' : 'status');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), err ? 7000 : 3500);
}

/* ---------------------------------------------------------------------
   Clipboard (with an honest fallback)
   --------------------------------------------------------------------- */
async function copyText(text, textarea) {
  try {
    if (navigator.clipboard && window.isSecureContext !== false) { await navigator.clipboard.writeText(text); return 'ok'; }
  } catch {}
  try {
    const t = document.createElement('textarea');
    t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    const ok = document.execCommand('copy'); t.remove();
    if (ok) return 'ok';
  } catch {}
  if (textarea) { textarea.focus(); textarea.select(); }
  return 'manual';
}

/* ---------------------------------------------------------------------
   Downloads
   --------------------------------------------------------------------- */
function stamp() { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`; }
function download(name, obj) {
  const text = JSON.stringify(obj, null, 2);
  try {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`Download started: ${name}. Check your downloads folder.`);
  } catch (e) {
    openModal('Copy your backup', `<p class="small">The browser blocked the download (${esc(e.message)}). Copy this JSON into a file named <b>${esc(name)}</b>.</p><textarea class="prompt" rows="16" readonly id="manualJson">${esc(text)}</textarea>`, `<button class="btn" data-act="closeModal">Close</button>`);
  }
}
function buildExport() {
  return { app: APP_NAME, kind: 'full-backup', schemaVersion: SCHEMA_VERSION, exportedAt: nowISO(), ...clone(S) };
}
function buildQuestionExport(q) {
  const pats = Object.fromEntries(q.patternIds.filter(id => S.patterns[id]).map(id => [id, clone(S.patterns[id])]));
  return {
    app: APP_NAME, kind: 'single-question', schemaVersion: SCHEMA_VERSION, exportedAt: nowISO(),
    syllabus: { id: activeSyllabus().id, retrieved: activeSyllabus().retrieved },
    topicLabels: Object.fromEntries(q.syllabusLinks.map(id => [id, topicLabel(id)])),
    question: clone(q), patterns: pats,
  };
}

/* ---------------------------------------------------------------------
   Import: validate, then merge or replace — never silently
   --------------------------------------------------------------------- */
function validateBackup(obj) {
  const errors = [];
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok: false, errors: ['The file is not a JSON object.'] };
  let kind = obj.kind === 'single-question' ? 'single-question' : 'full-backup';
  if (typeof obj.schemaVersion !== 'number') errors.push('Missing schemaVersion, so this does not look like a GATE EE Prep OS backup.');
  else if (obj.schemaVersion > SCHEMA_VERSION) errors.push(`The file uses schema version ${obj.schemaVersion}, newer than this app (${SCHEMA_VERSION}).`);
  let questions = {}, patterns = {};
  if (kind === 'single-question') {
    if (!obj.question || typeof obj.question !== 'object') errors.push('The single-question file has no question.');
    else questions = { [obj.question.id]: obj.question };
    patterns = obj.patterns || {};
  } else {
    if (!obj.questions || typeof obj.questions !== 'object' || Array.isArray(obj.questions)) errors.push('"questions" is missing or is not an object.');
    else questions = obj.questions;
    patterns = obj.patterns || {};
    if (obj.scores !== undefined && !Array.isArray(obj.scores)) errors.push('"scores" is not a list.');
  }
  if (typeof patterns !== 'object' || Array.isArray(patterns)) { errors.push('"patterns" is not an object.'); patterns = {}; }
  for (const [k, q] of Object.entries(questions)) {
    if (!q || typeof q !== 'object') { errors.push(`Question ${k} is not an object.`); continue; }
    if (typeof q.id !== 'string' || !/^EE-Q-\d{4,}$/.test(q.id)) errors.push(`Question key "${k}" has an invalid id "${q.id}".`);
    else if (k !== q.id) errors.push(`Question key "${k}" does not match its id "${q.id}".`);
    for (const f of ['attempts', 'interactions', 'patternIds', 'variations', 'mistakes', 'syllabusLinks']) if (q[f] !== undefined && !Array.isArray(q[f])) errors.push(`${q.id || k}: "${f}" must be a list.`);
    if (Array.isArray(q.interactions)) q.interactions.forEach((i, n) => { if (!i || typeof i.id !== 'string' || typeof i.task !== 'string') errors.push(`${q.id}: interaction ${n + 1} has no id or task.`); });
  }
  for (const [k, p] of Object.entries(patterns)) {
    if (!p || typeof p !== 'object' || typeof p.id !== 'string' || !/^EE-P-\d{3,}$/.test(p.id) || p.id !== k) errors.push(`Pattern "${k}" has an invalid or mismatched id.`);
  }
  return { ok: !errors.length, errors: errors.slice(0, 12), moreErrors: Math.max(0, errors.length - 12), kind, questions, patterns, raw: obj };
}

function importDialog(v, fileName) {
  UI.pendingImport = v;
  const qIds = Object.keys(v.questions), pIds = Object.keys(v.patterns);
  const dupQ = qIds.filter(id => S.questions[id]);
  const dupP = pIds.filter(id => S.patterns[id]);
  const replaceAllowed = v.kind === 'full-backup';
  openModal('Import ' + fileName, `
    <div class="stack">
      <p>${v.kind === 'single-question' ? 'Single-question export' : 'Full backup'} from ${esc(v.raw.exportedAt ? fmtTime(v.raw.exportedAt) : 'an unknown date')}: ${plural(qIds.length, 'question')} (${v.questions && Object.values(v.questions).reduce((n, q) => n + (q.interactions?.length || 0), 0)} saved prompts/replies), ${plural(pIds.length, 'pattern')}${v.kind === 'full-backup' ? `, ${plural((v.raw.scores || []).length, 'score')}` : ''}.</p>
      ${dupQ.length || dupP.length ? `<div class="note warn small"><b>${plural(dupQ.length, 'question ID')} and ${plural(dupP.length, 'pattern ID')} already exist here:</b> ${esc([...dupQ, ...dupP].slice(0, 12).join(', '))}${dupQ.length + dupP.length > 12 ? '…' : ''}</div>
        <label class="f">When an ID already exists${selectEl('id="dupPolicy"', [['newest', 'Keep whichever record was updated more recently'], ['mine', 'Keep my current record'], ['theirs', 'Use the imported record'], ['both', 'Keep both (the imported one gets a new ID)']], 'newest')}</label>` : '<p class="small">No ID conflicts. Merging adds everything.</p>'}
      <p class="small muted">Merge keeps everything you have and adds the file’s records. ${replaceAllowed ? 'Replace swaps all your data for the file’s data; your current data is kept for “Undo last import”.' : 'Single-question files can only be merged.'}</p>
    </div>`,
    `<button class="btn" data-act="closeModal">Cancel</button>${replaceAllowed ? '<button class="btn danger" data-act="importReplace">Replace all my data</button>' : ''}<button class="btn primary" data-act="importMerge">Merge into my data</button>`);
}

function doMerge(v, policy) {
  const remapP = {}, report = { addedQ: 0, updatedQ: 0, keptQ: 0, renamedQ: 0, addedP: 0, updatedP: 0, renamedP: 0 };
  for (const [id, raw] of Object.entries(v.patterns)) {
    const p = normPattern(raw);
    const mine = S.patterns[id];
    if (!mine) { S.patterns[id] = p; report.addedP++; continue; }
    if (mine.updatedAt === p.updatedAt) continue;
    if (policy === 'both') { const np = createPattern({ ...p }); remapP[id] = np.id; report.renamedP++; continue; }
    if (policy === 'theirs' || (policy === 'newest' && p.updatedAt > mine.updatedAt)) { S.patterns[id] = p; report.updatedP++; }
  }
  for (const [id, raw] of Object.entries(v.questions)) {
    const q = normQuestion(raw);
    q.patternIds = q.patternIds.map(pid => remapP[pid] || pid).filter(pid => S.patterns[pid]);
    const mine = S.questions[id];
    if (!mine) { S.questions[id] = q; report.addedQ++; continue; }
    if (mine.updatedAt === q.updatedAt) { report.keptQ++; continue; }
    if (policy === 'both') { const nq = createQuestion({}); const nid = nq.id; Object.assign(nq, q, { id: nid }); nq.notes = (nq.notes ? nq.notes + '\n' : '') + `Imported copy of ${id}.`; report.renamedQ++; continue; }
    if (policy === 'theirs' || (policy === 'newest' && q.updatedAt > mine.updatedAt)) { S.questions[id] = q; report.updatedQ++; } else report.keptQ++;
  }
  if (v.kind === 'full-backup') {
    const have = new Set(S.scores.map(s => s.id));
    (v.raw.scores || []).forEach(s => { if (s && s.id && !have.has(s.id)) S.scores.push(s); });
    for (const [d, n] of Object.entries(v.raw.activity || {})) S.activity[d] = Math.max(S.activity[d] || 0, +n || 0);
    for (const [k, n] of Object.entries(v.raw.topicNotes || {})) if (!S.topicNotes[k]) S.topicNotes[k] = n;
  }
  fixCounters(S);
  return report;
}

/* ---------------------------------------------------------------------
   Timers
   --------------------------------------------------------------------- */
let _tickDay = null;
function tickTimers() {
  const now = new Date(), end = dayEndAt(now);
  $$('[data-dayend]').forEach(el => { el.textContent = fmtCountdown(end - now); });
  $$('[data-dayfill]').forEach(el => { el.style.width = (100 - ((end - now) / 864e5) * 100).toFixed(2) + '%'; });
  const k = dayKey();
  if (_tickDay && _tickDay !== k && UI.route.view === 'dashboard' && !DataFile.gate) { _tickDay = k; rerender(); toast('A new study day has started.'); return; }
  _tickDay = k;
  $$('[data-timer-start]').forEach(el => {
    const s = Math.max(0, Math.floor((Date.now() - Date.parse(el.dataset.timerStart)) / 1000));
    el.textContent = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  });
}
setInterval(tickTimers, 1000);

  varsFromReply(el) {

  addMistake(el) {

  reveal(el) { const d = UI.review[el.dataset.id]; if (d) d.revealed = true; rerender(); },
  saveReview(el) {
    const q = getQ(el.dataset.id); const d = UI.review[q.id];

    const entry = applyRevision(q, { result: d.result, method: d.method, reason: d.reason, felt: d.felt, forgotten: d.forgotten.trim(), mistakes: d.mistakes.trim(), minutes: d.minutes || null, revealedFirst: !!d.revealed, compare: '' });
    if (q.timerStart) q.timerStart = null;
    if (d.mistakes.trim()) q.mistakes.push({ id: uid('mis'), type: 'careless', note: 'Revision: ' + d.mistakes.trim(), at: nowISO() });
    const why = entry.counts ? '' : d.result !== 'independent' ? 'it wasn’t an independent solve' : entry.revealedFirst ? 'notes were revealed first' : `only ${entry.delayDays} day(s) since your last solve (needs 3+)`;

  deleteQuestion(el) {

  exportAll() { flushSave(); download(`GATE_EE_Prep_OS_backup_${stamp()}.json`, buildExport()); },
  exportOne(el) { const q = getQ(el.dataset.id); if (q) download(`${q.id}_${stamp()}.json`, buildQuestionExport(q)); },
  exportOneSel() { const id = ($('#exportOneSel') || {}).value; if (!id) { toast('Choose a question to export.', true); return; } download(`${id}_${stamp()}.json`, buildQuestionExport(getQ(id))); },
  async importMerge() {
    const v = UI.pendingImport; if (!v) return;
    const policy = ($('#dupPolicy') || {}).value || 'newest';
    try { await kvSet('preImport', JSON.stringify(S)); UI.hasPreImport = true; } catch {}
    const r = doMerge(v, policy);
    UI.pendingImport = null; closeModal(); commit();
    toast(`Merged: ${r.addedQ} questions added, ${r.updatedQ} updated, ${r.renamedQ} kept as copies, ${plural(r.addedP + r.renamedP, 'pattern')} added, ${r.updatedP} updated.`);

  async importReplace() {
    const v = UI.pendingImport; if (!v || v.kind !== 'full-backup') return;
    if (!confirm('Replace ALL your current data with this backup? You can undo this with “Undo last import”.')) return;
    try { await kvSet('preImport', JSON.stringify(S)); UI.hasPreImport = true; }
    catch (e) { if (!confirm('Your current data could not be kept for undo (' + e.message + '). Replace anyway?')) return; }
    S = normState(v.raw); UI.pendingImport = null; closeModal(); applyTheme(); commit();
    toast(`Replaced with the backup: ${plural(qList().length, 'question')}.`);
  },
  async undoImport() {
    if (!confirm('Restore your data as it was just before the last import? Changes made since then will be lost.')) return;
    try {
      const prev = await kvGet('preImport');
      if (!prev) { toast('There is no earlier data to restore.', true); return; }
      S = normState(JSON.parse(prev)); await kvDel('preImport'); UI.hasPreImport = false; applyTheme(); commit();
      toast('Restored the data from before the import.');
    } catch (e) { toast('Could not undo: ' + e.message, true); }
  },
  fileOpen() { DataFile.pick('open'); },
  fileCreate() { DataFile.pick('create'); },
  fileReconnect() { DataFile.reconnect(); },
  fileDisconnect() { DataFile.disconnect(); },
  async persist() {
    if (!navigator.storage || !navigator.storage.persist) { toast('This browser does not support persistent-storage requests.', true); return; }
    const ok = await navigator.storage.persist();
    toast(ok ? 'The browser agreed to keep this data unless you clear it yourself.' : 'The browser declined. Keep exporting JSON backups.', !ok);
    updatePersistInfo();

  downloadSyllabus() { download(`GATE_EE_syllabus_${stamp()}.json`, { kind: 'syllabus', ...clone(activeSyllabus()) }); },
  resetSyllabus() { if (!confirm('Go back to the built-in official GATE 2027 syllabus?')) return; S.syllabusOverride = null; _topicCache = null; commit(); },
  wipe() {
    if ((($('#wipeConfirm') || {}).value || '').trim() !== 'DELETE') { toast('Type DELETE in the box to confirm.', true); return; }
    S = emptyState(); applyTheme(); commit(); toast('All data deleted.');

  closeModal() { UI.pendingImport = null; closeModal(); },
};

let draftTimer = null;
function draftSave() { clearTimeout(draftTimer); draftTimer = setTimeout(() => commit({ render: false }), 600); }

document.addEventListener('input', e => {
  const t = e.target, ds = t.dataset;
  if (t.id === 'qSearch') { UI.search = t.value; const pos = t.selectionStart; rerender(); const n = $('#qSearch'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
  if (t.id === 'patSearch') { UI.patSearch = t.value; const pos = t.selectionStart; rerender(); const n = $('#patSearch'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
  if (ds.ed) { const [iid, f] = ds.ed.split('|'); const d = UI.editReply[iid]; if (d) d[f] = t.value; return; }
  if (ds.extra !== undefined) { getUI(UI.prompts, ds.extra, { extra: '' }).extra = t.value; return; }
  if (ds.iprompt) { const q = getQ(ds.qid); const i = q && q.interactions.find(x => x.id === ds.iprompt); if (i) { i.prompt = t.value; draftSave(); } return; }
  if (ds.iresp) { const q = getQ(ds.qid); const i = q && q.interactions.find(x => x.id === ds.iresp); if (i) { i.responseDraft = t.value; draftSave(); } return; }
  if (ds.itake) { const q = getQ(ds.qid); const i = q && q.interactions.find(x => x.id === ds.itake); if (i) { i.takeaway = t.value; draftSave(); } return; }
  if (ds.ifollow) { const q = getQ(ds.qid); const i = q && q.interactions.find(x => x.id === ds.ifollow); if (i) { i.followUp = t.value; draftSave(); } return; }
  if (ds.vnote) { const q = getQ(ds.qid); const v = q && q.variations.find(x => x.id === ds.vnote); if (v) { v.notes = t.value; touch(q); draftSave(); } return; }
  if (ds.ab) { const [qid, mode, field] = ds.ab.split('|'); const d = UI.attempt[qid + '|' + mode]; if (d && field !== 'kind') d[field] = t.value; return; }
  if (ds.rb) { const [qid, field] = ds.rb.split('|'); const d = UI.review[qid]; if (d) d[field] = t.value; return; }
  if (ds.planEnd !== undefined && UI.planDraft) {
    const i = +ds.planEnd; UI.planDraft[i].end = t.value;
    const sum = $(`[data-plan-sum="${i}"]`); if (sum) sum.innerHTML = planSummary(planFor(UI.planDraft[i]));
    return;
  }
  if (ds.qa && UI.qa) {
    UI.qa[ds.qa] = t.value;
    if (ds.qa === 'find') { const r = $('#qaFindRes'); if (r) r.innerHTML = qaFindResults(); }
    if (ds.qa === 'year') { const had = !!GATE_SETS[t.dataset.prev]; t.dataset.prev = t.value; $$('[data-f="year"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === t.value))); if (had !== !!GATE_SETS[t.value] && String(t.value).length === 4) { UI.qa.set = ''; renderQuickAdd('qaYear'); } }
    const w = $('#qaWarn'); if (w) w.innerHTML = qaWarn();
    return;
  }
  if (ds.pickfilter !== undefined) {
    const f = t.value.trim().toLowerCase(); const box = t.parentElement;
    $$('.pk-item', box).forEach(l => { l.style.display = !f || f.split(/\s+/).every(w => l.dataset.pkText.includes(w)) ? '' : 'none'; });
    $$('[data-pk-sec]', box).forEach(s => { s.style.display = $$('.pk-item', s).some(l => l.style.display !== 'none') ? '' : 'none'; });
  }
});

function setPath(obj, path, val) { const p = path.split('.'); let o = obj; for (let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = val; }
document.addEventListener('change', e => {
  const t = e.target, ds = t.dataset;
  if (ds.chaturl) {
    const q = getQ(ds.chaturl); if (!q) return;
    const v = t.value.trim();
    if (v && !safeUrl(v)) { toast('Paste the full chat link, starting with https://', true); t.value = q.chatUrl || ''; return; }
    if (v === (q.chatUrl || '')) return;
    q.chatUrl = v; touch(q);
    toast(v ? `Chat link saved to ${q.id}.` : `Chat link removed from ${q.id}.`);
    commit(); return;
  }
  if (ds.qfield) {
    const q = getQ(UI.route.id); if (!q) return;
    let v = t.value;
    if (ds.qfield.startsWith('pyq.')) {
      const f = ds.qfield.slice(4);
      q.pyq[f] = v;
      if (f === 'subject') { q.pyq.topic = ''; q.pyq.subtopic = ''; }
      if (f === 'topic') { q.pyq.subtopic = ''; const subs = portalTopic(q.pyq.subject, v)?.[2] || []; if (subs.length === 1) q.pyq.subtopic = subs[0][0]; }
      touch(q); commit(); return;
    }
    if (['tags', 'concepts'].includes(ds.qfield)) v = v.split(',').map(x => x.trim()).filter(Boolean);
    if (ds.qfield === 'source.year') v = v ? parseInt(v, 10) || null : null;
    if (ds.qfield === 'marks') v = v ? +v : null;
    setPath(q, ds.qfield, v); touch(q);
    commit({ render: ['source.type', 'qType', 'marks', 'source.year', 'source.questionNumber', 'title'].includes(ds.qfield) && t.tagName === 'SELECT' });
    return;
  }
  if (ds.ab) { const [qid, mode, field] = ds.ab.split('|'); const d = UI.attempt[qid + '|' + mode]; if (d) { d[field] = t.value; if (field === 'kind') rerender(); } return; }
  if (ds.iverdict) { const q = getQ(ds.qid); const i = q && q.interactions.find(x => x.id === ds.iverdict); if (i) { i.verdict = t.value; draftSave(); } return; }
  if (ds.imistake) { const q = getQ(ds.qid); const i = q && q.interactions.find(x => x.id === ds.imistake); if (i) { i.mistakeType = t.value; draftSave(); } return; }
  if (ds.topicCheck) {
    const target = ds.topicCheck;
    let list;
    if (target.startsWith('q:')) { const q = getQ(target.slice(2)); if (!q) return; list = q.syllabusLinks; touch(q); }
    else list = UI.patternDraft ? UI.patternDraft.links : null;
    if (!list) return;
    const i = list.indexOf(t.value);
    if (t.checked && i < 0) list.push(t.value); if (!t.checked && i >= 0) list.splice(i, 1);
    const chips = document.querySelector(`[data-pk-chips="${CSS.escape(target)}"]`);
    if (chips) chips.innerHTML = list.length ? list.map(id => `<span class="tag" title="${esc(topicLabel(id))}">${esc(topicIndex().byId[id]?.name || id)}</span>`).join('') : '<span class="small muted">None linked yet.</span>';
    if (target.startsWith('q:')) commit({ render: false });
    return;
  }
  if (ds.theory) { const n = S.topicNotes[ds.theory] || {}; n.theory = t.checked; S.topicNotes[ds.theory] = n; commit(); return; }
  if (ds.setting) {
    const k = ds.setting; let v = t.value;
    if (k === 'intervals') {
      const arr = v.split(/[,\s]+/).map(Number).filter(n => Number.isFinite(n) && n >= 1);
      if (!arr.length || arr.some((n, i) => i && n < arr[i - 1])) { toast('Use increasing whole days, e.g. 1, 3, 7, 21, 45.', true); rerender(); return; }
      v = arr.map(n => Math.round(n));
    } else if (k === 'targetDate') {
      if (v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast('Pick a valid date.', true); return; }
      if (v && v < dayKey()) { toast('Pick today or a later date.', true); rerender(); return; }
    } else if (['dayStartHour', 'maintenanceDays', 'targetMarks'].includes(k)) {
      v = Number(v); if (!Number.isFinite(v)) { toast('Enter a number.', true); return; }
      if (k === 'targetMarks') v = Math.max(1, Math.min(100, v));
      if (k === 'maintenanceDays') v = Math.max(14, Math.round(v));
    }
    S.settings[k] = v; if (k === 'theme') applyTheme();
    toast('Setting saved.'); commit(); return;
  }
  if (t.id === 'qFilter') { UI.listFilter = t.value; rerender(); return; }
  if (t.id === 'sylFilter') { UI.sylFilter = t.value; rerender(); return; }
  if (t.id === 'patSection') { UI.patSection = t.value; rerender(); return; }
  if (t.id === 'importFile' || t.id === 'sylFile') {
    const f = t.files && t.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      let obj;
      try { obj = JSON.parse(reader.result); } catch (err) { toast(`${f.name} is not valid JSON: ${err.message}`, true); t.value = ''; return; }
      if (t.id === 'sylFile') loadSyllabus(obj, f.name);
      else {
        const v = validateBackup(obj);
        if (!v.ok) openModal('This file can’t be imported', `<p>Nothing was changed. Problems found in ${esc(f.name)}:</p><ul>${v.errors.map(x => `<li class="small">${esc(x)}</li>`).join('')}</ul>${v.moreErrors ? `<p class="small">…and ${v.moreErrors} more.</p>` : ''}`, `<button class="btn" data-act="closeModal">Close</button>`);
        else importDialog(v, f.name);
      }
      t.value = '';
    };
    reader.onerror = () => toast('Could not read the file.', true);
    reader.readAsText(f);
  }
});

function loadSyllabus(obj, name) {
  const errs = [];
  const okSecs = arr => Array.isArray(arr) && arr.every(s => s && typeof s.id === 'string' && typeof s.name === 'string' && Array.isArray(s.groups) && s.groups.every(g => Array.isArray(g) && g.length === 2 && (g[0] === null || typeof g[0] === 'string') && Array.isArray(g[1]) && g[1].every(x => typeof x === 'string' && x.trim())));
  if (!obj || typeof obj !== 'object') errs.push('Not an object.');
  if (!okSecs(obj.sections) || !obj.sections.length) errs.push('"sections" must be a non-empty list of {id, name, groups: [[group name or null, [subtopics]]]}.');
  if (obj.ga !== undefined && !okSecs(obj.ga)) errs.push('"ga" has the wrong shape.');
  if (!obj.title || !obj.retrieved) errs.push('Add "title" and "retrieved" (the date you took it from the official PDF) so the source stays traceable.');
  if (errs.length) { openModal('Syllabus not loaded', `<p>Nothing changed. Problems in ${esc(name)}:</p><ul>${errs.map(x => `<li class="small">${esc(x)}</li>`).join('')}</ul>`, `<button class="btn" data-act="closeModal">Close</button>`); return; }
  if (!confirm(`Use “${obj.title}” (retrieved ${obj.retrieved}) instead of the current syllabus? Existing links are kept by ID.`)) return;
  S.syllabusOverride = { id: obj.id || 'custom-' + Date.now(), title: obj.title, source: obj.source || '', gaSource: obj.gaSource || '', index: obj.index || '', retrieved: obj.retrieved, version: obj.version || '', sections: obj.sections, ga: obj.ga || [] };
  _topicCache = null; commit(); toast('Syllabus replaced.');
}

/* ---------------------------------------------------------------------
   Init
   --------------------------------------------------------------------- */
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
async function updatePersistInfo() {
  const el = $('#persistInfo'); if (!el) return;
  try {
    if (navigator.storage && navigator.storage.persisted) {
      const p = await navigator.storage.persisted();
      let extra = '';
      if (navigator.storage.estimate) { const e = await navigator.storage.estimate(); if (e.usage != null) extra = ` Using about ${(e.usage / 1048576).toFixed(1)} MB${e.quota ? ` of ${(e.quota / 1048576).toFixed(0)} MB available` : ''}.`; }
      el.textContent = (p ? 'The browser has agreed to keep this data.' : 'The browser may clear this data under storage pressure. Export backups regularly.') + extra;
    } else el.textContent = 'This browser does not report storage persistence. Export backups regularly.';
  } catch { el.textContent = 'Storage status unavailable.'; }
}
window.addEventListener('hashchange', () => { rerender(); if (UI.route.view === 'settings') updatePersistInfo(); window.scrollTo(0, 0); });

async function init() {
  if (DataFile.supported()) {
    await DataFile.start();
    try { UI.hasPreImport = !!(await kvGet('preImport')); } catch {}
    if (DataFile.mode === 'file') setSaveStatus('saved', `Loaded from ${DataFile.handle.name}`);
    else setSaveStatus('error', 'No data file connected yet');
    rerender();
    if (UI.route.view === 'settings') updatePersistInfo();
    window.__gateReady = true;
    return;
  }
  const raw = await Storage.load();
  try { S = normState(typeof raw === 'string' ? JSON.parse(raw) : raw); }
  catch (e) { S = emptyState(); UI.banner = 'Saved data could not be read (' + e.message + '). Starting empty; your old data is untouched in storage. Import a backup if you have one.'; Storage.backend = 'memory'; }
  if (Storage.error) UI.banner = Storage.error;
  else UI.banner = 'This browser cannot link a JSON file on disk, so data stays in browser storage. Open this page in Chrome or Edge on a computer to store everything in a JSON file.';
  applyTheme();
  try { UI.hasPreImport = !!(await kvGet('preImport')); } catch {}
  setSaveStatus(Storage.backend === 'memory' ? 'error' : 'saved', Storage.backend === 'memory' ? 'Not saving: no browser storage' : `Stored in this browser (${Storage.backend})`);
  rerender();
  if (UI.route.view === 'settings') updatePersistInfo();
  window.__gateReady = true;
}
init();

</script>
