<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GATE EE Prep OS</title>
<meta name="description" content="Question-first GATE Electrical Engineering preparation: prompts, evidence-based progress, patterns and spaced revision. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D7559'/%3E%3Cpath d='M4 16h6l3-7 6 14 3-7h6' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F2; --panel:#FFFFFF; --sunk:#E8EDEA; --ink:#14212A; --ink2:#384852; --muted:#62717A; --line:#D3DBD7; --wire:#9AA8AE;
  --live:#0D7559; --live-ink:#FFFFFF; --live-soft:#DDEFE7; --amber:#94600F; --amber-soft:#F6EAD3; --fault:#AE3329; --fault-soft:#F7E1DE;
  --blue:#2B5A8C; --blue-soft:#E1EAF4;
  --r-s:6px; --r-m:10px;
  --font:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E161B; --panel:#142027; --sunk:#0B1216; --ink:#E2EAEC; --ink2:#BAC7CC; --muted:#8D9CA3; --line:#25343C; --wire:#3F535C;
    --live:#3DBB92; --live-ink:#06231A; --live-soft:#153A2F; --amber:#E2A84C; --amber-soft:#3A2C14; --fault:#E5786D; --fault-soft:#3D1D1A;
    --blue:#7FA9D6; --blue-soft:#18293A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E161B; --panel:#142027; --sunk:#0B1216; --ink:#E2EAEC; --ink2:#BAC7CC; --muted:#8D9CA3; --line:#25343C; --wire:#3F535C;
  --live:#3DBB92; --live-ink:#06231A; --live-soft:#153A2F; --amber:#E2A84C; --amber-soft:#3A2C14; --fault:#E5786D; --fault-soft:#3D1D1A;
  --blue:#7FA9D6; --blue-soft:#18293A; color-scheme:dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--paper); color:var(--ink); font:15px/1.55 var(--font); -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0; line-height:1.25; font-weight:600}
h1{font-size:26px; letter-spacing:-.01em}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0 0 .6em}
a{color:var(--blue)}
small,.small{font-size:13px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--live); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:216px 1fr; min-height:100vh}
.side{position:sticky; top:0; height:100vh; border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:18px; background:var(--paper)}
.brand{display:flex; gap:10px; align-items:center; padding:0 6px}
.brand svg{flex:none}
.brand b{display:block; font-size:15px}
.brand span{display:block; font-size:12px; color:var(--muted)}
.nav{display:flex; flex-direction:column; gap:2px}
.nav a{display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:var(--r-s); color:var(--ink2); text-decoration:none; font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--ink); color:var(--paper)}
.nav .count{font-size:12px; min-width:20px; text-align:center; padding:0 6px; border-radius:10px; background:var(--amber-soft); color:var(--amber); font-weight:600}
.nav a[aria-current="page"] .count{background:var(--amber); color:var(--paper)}
.save-ind{margin-top:auto; font-size:12px; color:var(--muted); padding:8px 10px; border-top:1px solid var(--line)}
.save-ind .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--wire); margin-right:6px; vertical-align:1px}
.save-ind[data-s="saved"] .dot{background:var(--live)}
.save-ind[data-s="saving"] .dot{background:var(--amber)}
.save-ind[data-s="error"] .dot{background:var(--fault)}
.save-ind[data-s="error"]{color:var(--fault)}
main{min-width:0; padding:28px 32px 80px}
.page-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:22px}
.page-head p{margin:4px 0 0; color:var(--muted); max-width:62ch}

@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky; z-index:20; height:auto; flex-direction:row; align-items:center; padding:8px 10px; border-right:0; border-bottom:1px solid var(--line); gap:10px; overflow-x:auto}
  .brand span{display:none}
  .brand b{font-size:14px; white-space:nowrap}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap; padding:6px 9px; font-size:14px; gap:6px}
  .save-ind{margin:0; border:0; padding:0 4px; white-space:nowrap}
  .save-ind .txt{display:none}
  main{padding:18px 14px 70px}
}

/* ---------- controls ---------- */
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); padding:7px 13px; border-radius:var(--r-s); cursor:pointer; font-weight:500; line-height:1.3; text-decoration:none; color:var(--ink)}
.btn:hover{border-color:var(--wire)}
.btn.primary{background:var(--live); border-color:var(--live); color:var(--live-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{padding:10px 18px; font-size:16px}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--fault); border-color:var(--fault-soft)}
.btn.small{padding:4px 9px; font-size:13px}
.btn[disabled]{opacity:.45; cursor:not-allowed; filter:none}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.stack{display:flex; flex-direction:column; gap:10px}
.spacer{flex:1}
label.f{display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:500; color:var(--ink2)}
input[type=text],input[type=url],input[type=number],input[type=search],input[type=date],select,textarea{border:1px solid var(--line); border-radius:var(--r-s); background:var(--panel); padding:7px 10px; width:100%; min-width:0}
textarea{resize:vertical; line-height:1.5}
textarea.prompt{font-family:var(--mono); font-size:12.5px; background:var(--sunk); min-height:220px}
input:focus,select:focus,textarea:focus{border-color:var(--live); outline:none; box-shadow:0 0 0 3px var(--live-soft)}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.seg{display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:var(--r-s); overflow:hidden; background:var(--panel)}
.seg button{border:0; background:transparent; padding:7px 12px; cursor:pointer; border-right:1px solid var(--line); font-weight:500; color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.seg button[disabled]{opacity:.45; cursor:not-allowed}
.choices{display:flex; flex-wrap:wrap; gap:6px}
.choice{border:1px solid var(--line); background:var(--panel); border-radius:20px; padding:5px 12px; cursor:pointer; font-size:14px}
.choice[aria-pressed="true"]{background:var(--live-soft); border-color:var(--live); color:var(--ink); font-weight:600}
.choice[disabled]{opacity:.4; cursor:not-allowed}

/* ---------- surfaces ---------- */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-m); padding:18px 20px}
.panel + .panel{margin-top:14px}
.panel h2{margin-bottom:8px}
.sub{border-top:1px solid var(--line); margin-top:16px; padding-top:16px}
.note{background:var(--sunk); border-radius:var(--r-s); padding:10px 12px; font-size:14px; color:var(--ink2)}
.note.attach{background:var(--blue-soft); color:var(--ink)}
.note.warn{background:var(--amber-soft); color:var(--ink)}
.note.bad{background:var(--fault-soft); color:var(--ink)}
.pill{display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:10px; background:var(--sunk); color:var(--ink2); white-space:nowrap}
.pill.l0{background:var(--sunk); color:var(--muted)}
.pill.l1{background:var(--blue-soft); color:var(--blue)}
.pill.l2{background:var(--amber-soft); color:var(--amber)}
.pill.l3{background:var(--live-soft); color:var(--live)}
.pill.l4{background:var(--live); color:var(--live-ink)}
.pill.due{background:var(--amber); color:var(--paper)}
.pill.bad{background:var(--fault-soft); color:var(--fault)}
.chip{display:inline-flex; gap:4px; align-items:center; font-size:12.5px; border:1px dashed var(--wire); border-radius:12px; padding:2px 9px; background:transparent; cursor:pointer; color:var(--ink2)}
.chip:hover{border-style:solid; border-color:var(--live)}
.tag{display:inline-block; font-size:12.5px; border:1px solid var(--line); border-radius:12px; padding:1px 8px; color:var(--ink2); background:var(--panel)}
.empty{text-align:left; padding:28px 4px; color:var(--muted)}
.empty h3{color:var(--ink); margin-bottom:6px}
hr.rule{border:0; border-top:1px solid var(--line); margin:16px 0}
details.fold > summary{cursor:pointer; list-style:none; font-weight:600; padding:4px 0}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::before{content:"+"; display:inline-block; width:16px; color:var(--muted); font-family:var(--mono)}
details.fold[open] > summary::before{content:"−"}

/* ---------- dashboard ---------- */
.today{display:grid; grid-template-columns:1.3fr 1fr; gap:14px; margin-bottom:14px; align-items:start}
.today > .panel{margin-top:0}
@media (max-width:980px){.today{grid-template-columns:1fr}}
.continue li{display:flex; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
.continue li:first-child{border-top:0}
.continue ul{list-style:none; margin:0; padding:0}
.ev{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; border:1px solid var(--line); border-radius:var(--r-m); background:var(--panel); overflow:hidden}
@media (max-width:1100px){.ev{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.ev{grid-template-columns:1fr}}
.ev section{padding:16px 18px; border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.ev h3{font-size:14px; color:var(--muted); font-weight:600; margin-bottom:10px}
.ev dl{margin:0; display:grid; grid-template-columns:1fr auto; gap:6px 10px; font-size:14px}
.ev dt{color:var(--ink2)}
.ev dd{margin:0; font-weight:600; text-align:right; font-variant-numeric:tabular-nums}
.ev .how{margin-top:10px; font-size:12px; color:var(--muted)}
.bigfig{font-size:30px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.meter{height:8px; background:var(--sunk); border-radius:4px; overflow:hidden; display:flex}
.meter i{display:block; height:100%}

/* ---------- workspace ---------- */
.ws{display:grid; grid-template-columns:290px minmax(0,1fr); gap:20px; align-items:start}
.ws > *{min-width:0}
@media (max-width:1060px){.ws{grid-template-columns:minmax(0,1fr)} .ws.has-q .qlist{display:none} .ws:not(.has-q) .wsmain{display:none}}
.qlist{position:sticky; top:16px; max-height:calc(100vh - 32px); display:flex; flex-direction:column; gap:10px}
.qlist .items{overflow:auto; border:1px solid var(--line); border-radius:var(--r-m); background:var(--panel)}
.qitem{display:block; padding:10px 12px; border-bottom:1px solid var(--line); text-decoration:none; color:var(--ink)}
.qitem:last-child{border-bottom:0}
.qitem:hover{background:var(--sunk)}
.qitem[aria-current="true"]{background:var(--live-soft); box-shadow:inset 3px 0 0 var(--live)}
.qitem .t{font-weight:500; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.qitem .m{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted); margin-top:3px; flex-wrap:wrap}
.qid{font-family:var(--mono); font-size:12.5px; color:var(--muted); letter-spacing:.01em}
.qhead{display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; margin-bottom:14px}
.qhead input.title{font-size:21px; font-weight:600; border-color:transparent; background:transparent; padding:2px 6px; margin-left:-6px}
.qhead input.title:hover{border-color:var(--line)}
.nextbar{display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-left:3px solid var(--live); background:var(--panel); border-radius:0 var(--r-s) var(--r-s) 0; padding:10px 14px; margin:14px 0}
.nextbar b{font-weight:600}

/* the circuit-trace stepper */
.trace{position:relative; display:grid; grid-template-columns:repeat(7,minmax(84px,1fr)); padding:6px 0 2px; overflow-x:auto}
.trace .node{position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; border:0; background:none; cursor:pointer; padding:0 4px 6px; color:var(--ink2); text-align:center}
.trace .node::before{content:""; position:absolute; top:11px; left:-50%; width:100%; height:2px; background:var(--wire)}
.trace .node:first-child::before{display:none}
.trace .node.done::before,.trace .node.done-left::before{background:var(--live)}
.trace .term{position:relative; z-index:1; width:24px; height:24px; border-radius:50%; border:2px solid var(--wire); background:var(--paper); display:grid; place-items:center; font-size:11px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums}
.trace .done .term{background:var(--live); border-color:var(--live); color:var(--live-ink)}
.trace .skip .term{border-style:dashed; border-color:var(--live); color:var(--live)}
.trace .lbl{font-size:12.5px; line-height:1.25; max-width:110px}
.trace .node[aria-current="step"] .term{box-shadow:0 0 0 4px var(--live-soft); border-color:var(--live)}
.trace .node[aria-current="step"] .lbl{color:var(--ink); font-weight:600}
.trace .node:hover .lbl{color:var(--ink)}

/* task box */
.task{border:1px solid var(--line); border-radius:var(--r-m); background:var(--panel)}
.task > .hd{display:flex; gap:12px; align-items:flex-start; justify-content:space-between; padding:16px 18px 0; flex-wrap:wrap}
.task > .bd{padding:14px 18px 18px}
.task .lock{color:var(--muted)}
.reply-view{white-space:pre-wrap; font-size:14.5px; line-height:1.6; max-height:520px; overflow:auto; background:var(--sunk); border-radius:var(--r-s); padding:12px 14px}
.reply-view .rh{display:block; font-weight:700; margin-top:10px; color:var(--ink)}
.reply-view .rh:first-child{margin-top:0}
.timeline{list-style:none; margin:0; padding:0}
.timeline > li{padding:10px 0; border-top:1px solid var(--line)}
.timeline > li:first-child{border-top:0}
.timeline .when{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.hintstep{display:flex; gap:8px; align-items:center}
.timer{font-family:var(--mono); font-size:22px; font-variant-numeric:tabular-nums}

/* syllabus */
.sec{border:1px solid var(--line); border-radius:var(--r-m); background:var(--panel); margin-bottom:10px}
.sec > summary{display:grid; grid-template-columns:minmax(0,1fr) 220px auto; gap:14px; align-items:center; padding:12px 16px; cursor:pointer; list-style:none}
.sec > summary::-webkit-details-marker{display:none}
@media (max-width:700px){.sec > summary{grid-template-columns:1fr; gap:6px}}
.sec .body{padding:0 16px 12px}
.grp{font-size:13px; font-weight:600; color:var(--muted); margin:12px 0 4px}
.topic{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line)}
.topic .nm{font-size:14px}
.topic .flags{display:flex; gap:4px; flex-wrap:wrap; margin-top:3px}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.st-0{background:var(--sunk)} .st-1{background:#9DB8D6} .st-2{background:#7E9AB8} .st-3{background:#C99A4A} .st-4{background:#7FC2A6} .st-5{background:#D97A6E} .st-6{background:var(--live)}

/* patterns */
.pcard{border:1px solid var(--line); border-radius:var(--r-m); background:var(--panel); margin-bottom:10px}
.pcard > summary{padding:12px 16px; cursor:pointer; list-style:none; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.pcard > summary::-webkit-details-marker{display:none}
.pcard .hook{color:var(--ink2); font-size:14px; flex-basis:100%}
.pcard .body{padding:0 16px 14px}
.pfield{margin-top:10px}
.pfield h4{font-size:13px; color:var(--muted); margin-bottom:2px}
.pfield div{white-space:pre-wrap; font-size:14.5px; max-width:78ch}

/* modal + toast */
dialog{border:1px solid var(--line); border-radius:var(--r-m); background:var(--panel); color:var(--ink); padding:0; width:min(760px, calc(100vw - 24px)); max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,20,26,.45)}
dialog .mh{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:1}
dialog .mb{padding:16px 18px; overflow:auto}
dialog .mf{display:flex; gap:8px; justify-content:flex-end; padding:12px 18px; border-top:1px solid var(--line); position:sticky; bottom:0; background:var(--panel)}
.toasts{position:fixed; bottom:calc(16px + env(safe-area-inset-bottom,0px)); right:16px; display:flex; flex-direction:column; gap:8px; z-index:100; max-width:min(420px, calc(100vw - 32px))}
.toast{background:var(--ink); color:var(--paper); padding:10px 14px; border-radius:var(--r-s); font-size:14px; box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.err{background:var(--fault); color:#fff}
.banner{background:var(--fault-soft); border:1px solid var(--fault); color:var(--ink); padding:10px 14px; border-radius:var(--r-s); margin-bottom:14px}
.bars{display:flex; align-items:flex-end; gap:6px; height:110px; position:relative; padding-top:6px}
.bars .b{flex:1; max-width:34px; background:var(--blue); border-radius:3px 3px 0 0; position:relative}
.bars .b.ok{background:var(--live)}
.bars .goal{position:absolute; left:0; right:0; border-top:2px dashed var(--amber)}
table.plain{border-collapse:collapse; width:100%; font-size:14px}
table.plain th,table.plain td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top}
table.plain th{color:var(--muted); font-weight:600; font-size:13px}

/* ---------- PYQ tracker ---------- */
.pyq-sum{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border:1px solid var(--line); border-radius:var(--r-m); background:var(--panel); margin-bottom:14px; overflow:hidden}
.pyq-sum > div{padding:12px 16px; border-right:1px solid var(--line)}
.pyq-sum > div:last-child{border-right:0}
.pyq-sum .lbl{display:block; font-size:12.5px; color:var(--muted)}
.pyq-sum .v{display:block; font-size:24px; font-weight:600; font-variant-numeric:tabular-nums}
@media (max-width:700px){.pyq-sum{grid-template-columns:repeat(2,minmax(0,1fr))} .pyq-sum > div{border-bottom:1px solid var(--line)}}
.pyq{min-width:640px; border:1px solid var(--line); border-radius:var(--r-m); background:var(--panel); overflow:hidden}
.pyq-row{display:grid; grid-template-columns:minmax(0,1fr) 84px 64px 80px 64px 86px; gap:8px; align-items:center; padding:9px 14px; border-top:1px solid var(--line)}
.pyq-row .n{text-align:center; font-variant-numeric:tabular-nums}
.pyq-row .z{color:var(--wire)}
.pyq-row .ok{color:var(--live)}
.pyq-row .act{text-align:right}
.pyq-row .cnt{font-size:12px; color:var(--muted); font-weight:400}
.pyq-head{border-top:0; background:var(--sunk); font-size:13px; font-weight:600; color:var(--ink2)}
.pyq details > summary{list-style:none; cursor:pointer}
.pyq details > summary::-webkit-details-marker{display:none}
.pyq .tw{display:inline-block; width:18px; color:var(--muted); font-family:var(--mono)}
.pyq .tw::before{content:"+"}
.pyq details[open] > summary .tw::before{content:"\2212"}
.pyq-row.lvl0{background:var(--sunk); font-weight:600}
.pyq-row.lvl0 .nm{display:flex; align-items:center; gap:0 4px; flex-wrap:wrap}
.pyq-meter{width:100%; max-width:220px; height:4px; margin:4px 0 0 18px; flex-basis:100%}
.pyq-row.lvl1{padding-left:26px}
.pyq-row.lvl2{padding:6px 14px 6px 62px; font-size:14px}
.pyq-subs{background:var(--paper)}
.pyq summary:hover, .pyq-row.lvl2:hover{background:var(--live-soft)}
.pyq-add{padding:3px 9px}

/* ---------- quick add ---------- */
.qa{gap:14px}
.qa-lbl{font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em}
.qa .choice{font-size:13.5px; padding:4px 11px}
.qa .choice .cnt{font-size:11.5px; color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums}
.qa-find{position:relative}
.qa-res{display:flex; flex-direction:column; gap:2px; margin-top:4px}
.qa-res:empty{display:none}
.qa-hit{display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline; text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:var(--r-s); padding:6px 10px; cursor:pointer}
.qa-hit:hover, .qa-hit:first-child{border-color:var(--live); background:var(--live-soft)}
.qa-path{display:flex; flex-wrap:wrap; align-items:center; gap:4px; padding:8px 12px; border-radius:var(--r-s); background:var(--sunk); border-left:3px solid var(--wire); font-weight:600}
.qa-path.ok{border-left-color:var(--live); background:var(--live-soft)}
.qa-line{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end}
.qa-line label.f{width:120px}
.qa-line .f{display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:500; color:var(--ink2)}
.qa .seg button{padding:6px 14px}
.kbd{display:inline-block; font-family:var(--mono); font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:var(--panel); color:var(--ink2); margin-right:4px}
@media (max-width:640px){.qa-keys{display:none}}

/* ---------- daily plan ---------- */
.plan{display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:14px; margin-bottom:8px}
.plan > .panel{margin-top:0}
.plan h3{font-size:14px; color:var(--muted); font-weight:600; margin-bottom:8px}
@media (max-width:980px){.plan{grid-template-columns:1fr}}
.plan .of{font-size:16px; color:var(--muted); font-weight:500; letter-spacing:0}
.plan-big{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.plan-line{margin:0 0 14px}
.streak{display:flex; gap:4px; margin:10px 0}
.streak i{flex:1; max-width:18px; height:18px; border-radius:4px; background:var(--sunk); border:1px solid var(--line)}
.streak i.on{background:var(--live); border-color:var(--live)}
.streak i.now{outline:2px solid var(--amber); outline-offset:1px}

.goal-list{list-style:none; margin:4px 0 8px; padding:0; font-size:13.5px}
.goal-list li{display:flex; flex-direction:column; gap:1px; padding:5px 0; border-top:1px solid var(--line)}
.goal-list .gn{font-weight:600}
.goal-list .ok{color:var(--live)}
.goal-ed{border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px; background:var(--panel)}
.goal-ed .choice[disabled]{opacity:.4; cursor:not-allowed}
.goal-ed .choice{font-size:13.5px; padding:4px 11px}
.scroll-x{overflow-x:auto}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

</style>

const SUGGEST_STOP = new Set(['mean', 'median', 'mode', 'types', 'performance', 'connections', 'equivalent circuit', 'phasor diagram', 'principle of operation', 'characteristics and applications', 'curl', 'divergence', 'inductance', 'biasing', 'parallel operation', 'random variables', 'regulation and efficiency']);

function suggestTopics(text, exclude = []) {
  const low = ' ' + String(text || '').toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, ' ') + ' ';
  const out = [];
  for (const t of topicIndex().list) {
    if (exclude.includes(t.id) || t.area !== 'EE') continue;
    const n = t.name.toLowerCase().replace(/[’']/g, "'").replace(/ theorem$/, '');
    if (n.length < 3 || SUGGEST_STOP.has(n)) continue;

/* ---------------------------------------------------------------------

   The save indicator only says "Saved" after a write actually succeeded.
   --------------------------------------------------------------------- */
const DB_NAME = 'gate-ee-prep-os', DB_STORE = 'kv', LS_KEY = 'gate-ee-prep-os:v1';
let dbPromise = null;
function openDB() {
  if (!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB is not available in this browser.'));
  return dbPromise ||= new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(DB_NAME, 1); } catch (e) { reject(e); return; }
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB could not be opened.'));
    req.onblocked = () => reject(new Error('IndexedDB is blocked by another tab.'));
  });
}
async function kv(mode, fn) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const t = db.transaction(DB_STORE, mode);
    const req = fn(t.objectStore(DB_STORE));
    t.oncomplete = () => resolve(req ? req.result : undefined);
    t.onerror = () => reject(t.error || new Error('IndexedDB transaction failed.'));
    t.onabort = () => reject(t.error || new Error('IndexedDB transaction was aborted (storage may be full).'));

const kvGet = k => kv('readonly', s => s.get(k));
const kvSet = (k, v) => kv('readwrite', s => s.put(v, k));
const kvDel = k => kv('readwrite', s => s.delete(k));

const Storage = {
  backend: 'memory', lastSavedAt: null, error: null,
  async load() {
    try {
      const v = await kvGet('state');
      this.backend = 'IndexedDB';
      if (v) return v;
      // Migrate from the localStorage fallback if an older session used it.
      try { const ls = localStorage.getItem(LS_KEY); if (ls) return JSON.parse(ls); } catch {}
      return null;
    } catch (e) {
      try {
        const ls = localStorage.getItem(LS_KEY);
        this.backend = 'localStorage';
        return ls ? JSON.parse(ls) : null;
      } catch (e2) {
        this.backend = 'memory';
        this.error = 'Browser storage is unavailable here. Your work will be lost when the tab closes unless you export a JSON backup.';
        return null;
      }
    }
  },
  async save(state) {
    if (DataFile.supported()) {
      if (DataFile.mode !== 'file') throw new Error('No JSON data file is connected yet, so nothing was written.');
      try { await DataFile.write(); }
      catch (e) {
        if (e && e.name === 'NotAllowedError') { DataFile.needsPermission = true; throw new Error(`The browser no longer lets this page write to ${DataFile.handle?.name || 'the data file'}. Open Settings → Data file and click “Allow writing again”.`); }
        throw new Error(`Could not write ${DataFile.handle?.name || 'the data file'}: ${(e && e.message) || e}`);
      }
      DataFile.needsPermission = false;
      this.backend = 'JSON file'; this.lastSavedAt = new Date(); this.error = null; return;
    }
    const json = JSON.stringify(state);
    if (this.backend === 'IndexedDB') {
      try { await kvSet('state', json); this.lastSavedAt = new Date(); this.error = null; return; }
      catch (e) {
        try { localStorage.setItem(LS_KEY, json); this.backend = 'localStorage'; this.lastSavedAt = new Date(); this.error = null; toast('IndexedDB failed, so this was saved to localStorage instead.'); return; }
        catch (e2) { throw new Error(storageErr(e)); }
      }
    }
    if (this.backend === 'localStorage') {
      try { localStorage.setItem(LS_KEY, json); this.lastSavedAt = new Date(); this.error = null; return; }
      catch (e) { throw new Error(storageErr(e)); }

  if (e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''))) return 'Browser storage is full. Export a JSON backup now, then free space.';

/* ---------------------------------------------------------------------

      else h = await window.showSaveFilePicker({ id: 'gate-ee-data', suggestedName: 'GATE_EE_Prep_OS_data.json', types: FILE_TYPES });

      if (perm !== 'granted') { toast('Write permission was not granted, so the file cannot be used.', true); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; toast('Could not open the file picker: ' + ((e && e.message) || e), true); return; }
    const inSession = this.mode === 'file';
    if (inSession) {
      await flushSave();
      let hasData = false;
      try { hasData = !!(await h.getFile()).size; } catch {}
      if (hasData && !confirm(`Switch to “${h.name}”? The app will show the data inside that file. Your current file keeps everything saved so far.`)) return;
    }
    await this.link(h, inSession ? clone(S) : this.legacy);
  },
  async reconnect() {
    if (!this.handle) return this.pick('open');
    try {
      const p = await this.handle.requestPermission({ mode: 'readwrite' });
      if (p !== 'granted') { toast('Permission was not granted, so the file is not being updated.', true); return; }
    } catch (e) { toast('Could not reconnect: ' + ((e && e.message) || e), true); return; }
    if (this.mode === 'file') {            // permission lost mid-session: S is still in memory, just write it back
      try { await this.write(); this.needsPermission = false; toast('Writing to the file again.'); setSaveStatus('saved', `Saved to ${this.handle.name}`); } catch (e) { toast('Still could not write: ' + ((e && e.message) || e), true); }
      rerender(); return;
    }
    if (await this.loadFromHandle()) setSaveStatus('saved', `Loaded from ${this.handle.name}`);
    rerender();
  },
  async disconnect() {
    if (!confirm('Disconnect from this data file? The file itself is not touched, but the app will ask you to choose a file again.')) return;
    await flushSave();
    this.legacy = clone(S);
    this.handle = null; try { await kvDel('fileHandle'); } catch {} this.clearHint();
    this.setGate('choose', 'Disconnected. Choose a file to continue; a new file will start with the data you were just using.');
    setSaveStatus('error', 'No data file connected');
    rerender();
  },
  async write() {
    const w = await this.handle.createWritable();      // writes to a temp copy; the real file only changes when close() succeeds
    await w.write(JSON.stringify(buildExport(), null, 2));
    await w.close();
    this.lastWrite = new Date();
  },
  label() {
    if (!this.supported()) return 'This browser cannot link a file on disk (use Chrome or Edge on a computer). Data is kept in browser storage; use Export all data for a JSON copy.';
    const hint = this.readHint();
    if (this.needsPermission) return `Linked to ${this.handle?.name || 'a file'}, but the browser needs your permission again before it can write.`;
    return `All data is stored in ${this.handle?.name || 'your file'}` + (this.lastWrite ? ` — last written ${this.lastWrite.toLocaleTimeString()}` : '') + (hint?.linkedAt ? `. Remembered in this browser since ${new Date(hint.linkedAt).toLocaleDateString()}.` : '.');
  },
};

function viewGate() {

/* ---------------------------------------------------------------------
   Mutations
   --------------------------------------------------------------------- */
function commit({ render = true } = {}) {
  S.meta.updatedAt = nowISO();
  scheduleSave();
  if (render) rerender();
}
function touch(q) { q.updatedAt = nowISO(); }
function bumpActivity(n = 1) { const k = dayKey(); S.activity[k] = (S.activity[k] || 0) + n; }

function createQuestion(partial = {}) {
  const id = `EE-Q-${String(S.meta.nextQuestion).padStart(4, '0')}`;
  S.meta.nextQuestion++;
  const q = normQuestion({ ...partial, id, createdAt: nowISO(), updatedAt: nowISO() });
  S.questions[id] = q;
  return q;
}
function createPattern(partial = {}) {
  const id = `EE-P-${String(S.meta.nextPattern).padStart(3, '0')}`;
  S.meta.nextPattern++;
  const p = normPattern({ ...partial, id, createdAt: nowISO(), updatedAt: nowISO() });
  S.patterns[id] = p;
  return p;
}
const getQ = id => S.questions[id] || null;
const qList = () => Object.values(S.questions);
const patternQuestions = pid => qList().filter(q => q.patternIds.includes(pid));

/* ---------------------------------------------------------------------
   Evidence: what has actually happened with a question
   --------------------------------------------------------------------- */
const hasReply = i => !!(i.response && i.response.trim());
const interactionsOf = (q, task) => q.interactions.filter(i => i.task === task);
const usedTask = (q, task) => q.interactions.some(i => i.task === task && (i.used || hasReply(i)));
const lastAttempt = q => q.attempts[q.attempts.length - 1] || null;
const isSolved = a => a && a.outcome === 'solved';

/* The day of the most recent help that could make a same-day "retry" a reproduction. */
function lastHelpDay(q) {
  const help = q.interactions.filter(i => ['theory', 'hint1', 'hint2', 'hint3', 'evaluate', 'aptitude'].includes(i.task) && (i.used || hasReply(i)));
  if (!help.length) return null;
  return help.map(i => i.day || dayKey(i.at)).sort().pop();
}
/* Suggest which kind of attempt this is from the help used since the last attempt. */
function suggestAttemptKind(q) {
  if (!q.attempts.length) {
    if (usedTask(q, 'hint3')) return 'after-solution';
    if (usedTask(q, 'hint2')) return 'after-hint2';
    if (usedTask(q, 'hint1')) return 'after-hint1';
    if (usedTask(q, 'theory')) return 'after-theory';
    return 'first';
  }
  const since = lastAttempt(q).at;
  const after = q.interactions.filter(i => (i.used || hasReply(i)) && (i.usedAt || i.at) > since).map(i => i.task);
  if (after.includes('hint3')) return 'after-solution';
  if (after.includes('hint2')) return 'after-hint2';
  if (after.includes('hint1')) return 'after-hint1';
  if (after.includes('theory')) return 'after-theory';
  return 'retry';
}
/* Never generous (as in PrepBoard): only a first attempt, or a retry on a later study day than any help, counts. */
function classifyAttempt(q, kind, outcome, day) {
  const solved = outcome === 'solved';
  if (!solved) return { indep: false, label: `${OUTCOME_LABEL[outcome]} (${KIND_LABEL[kind].toLowerCase()})` };
  if (kind === 'first') {
    const anyHelp = ['theory', 'hint1', 'hint2', 'hint3'].some(t => usedTask(q, t));
    return anyHelp ? { indep: false, label: 'Solved, but help had already been used' } : { indep: true, label: 'Solved independently after the concept lesson' };
  }
  if (kind === 'retry') {
    const h = lastHelpDay(q);
    if (h && h >= day) return { indep: false, label: 'Reproduced on the same study day as the help (counts as assisted)' };
    return { indep: true, label: 'Solved on an independent retry' };
  }
  const L = { 'after-theory': 'Solved after the missing-theory lesson', 'after-hint1': 'Solved after Hint 1', 'after-hint2': 'Solved after Hint 2', 'after-solution': 'Solved after viewing the full solution' };
  return { indep: false, label: L[kind] || 'Solved with help' };
}

function questionLevel(q) {
  const indep = q.attempts.some(a => a.indep && isSolved(a));
  const recalled = q.revision.history.some(h => h.counts);
  const lastRev = q.revision.history[q.revision.history.length - 1];
  const faded = lastRev && (lastRev.result === 'failed' || lastRev.result === 'answer-only');
  if (indep && recalled && !faded) return 4;
  if (indep) return 3;
  if (q.attempts.some(isSolved)) return 2;
  if (q.attempts.length || q.interactions.some(hasReply)) return 1;
  return 0;
}

function isDue(q) { return !!q.revision.nextReviewAt && q.revision.nextReviewAt <= dayKey(); }

/* ---------------------------------------------------------------------
   Stage completion and the next useful action
   --------------------------------------------------------------------- */
function stageState(q, stage) {
  const done = q.stagesDone[stage];
  switch (stage) {
    case 'learn': return interactionsOf(q, 'learn').some(hasReply) || done ? 'done' : '';
    case 'attempt': return q.attempts.length ? 'done' : '';
    case 'help':
      if (q.attempts.some(a => a.indep && isSolved(a)) && ['theory', 'hint1', 'hint2', 'hint3'].some(t => usedTask(q, t))) return 'done';
      if (q.attempts.some(a => a.indep && isSolved(a)) || done === 'skipped') return 'skip';
      return '';
    case 'evaluate': return interactionsOf(q, 'evaluate').some(hasReply) ? 'done' : (done === 'skipped' ? 'skip' : '');
    case 'pattern': return q.patternIds.length ? 'done' : '';
    case 'variations': return q.variations.some(v => v.status && v.status !== 'not-tried') ? 'done' : '';
    case 'history': return q.revision.history.length ? 'done' : '';
  }
  return '';
}

function nextAction(q) {
  if (isGA(q)) {
    if (!interactionsOf(q, 'aptitude').some(hasReply)) return { stage: 'attempt', text: 'Solve it on paper, then send the question and your solution with the one prompt.' };
    if (!q.attempts.length) return { stage: 'attempt', text: 'Record whether you got it right.' };
    if (isDue(q)) return { stage: 'history', text: 'Revision is due. Solve it again before looking at your notes.', review: true };
    if (!q.revision.nextReviewAt) return { stage: 'history', text: 'Schedule this question for revision.' };
    return { stage: 'history', text: `Next revision ${relDay(q.revision.nextReviewAt)} (${fmtDay(q.revision.nextReviewAt)}).` };
  }
  if (q.relearn) return { stage: 'learn', text: 'Relearn the main concept: revision showed it has faded.' };
  if (!stageState(q, 'learn')) return { stage: 'learn', text: 'Learn the main concept before your first attempt.' };
  if (!q.attempts.length) return { stage: 'attempt', text: 'Close the lesson and attempt the question on paper.' };
  const indep = q.attempts.some(a => a.indep && isSolved(a));
  const last = lastAttempt(q);
  if (!indep) {
    if (!isSolved(last)) {
      const diagnosedAfter = q.interactions.some(i => i.task === 'diagnose' && hasReply(i) && i.at > last.at);
      if (!diagnosedAfter && !interactionsOf(q, 'diagnose').some(hasReply)) return { stage: 'attempt', text: 'Diagnose where and why you got stuck.' };
      if (!usedTask(q, 'theory')) return { stage: 'help', text: 'Learn the missing theory the diagnosis found.', tab: 'theory' };
      const nextHint = ['hint1', 'hint2', 'hint3'].find(t => !usedTask(q, t));
      return { stage: 'help', text: nextHint ? `Try again, or take ${TASKS[nextHint].short}.` : 'Close the solution and solve it again from scratch.', tab: nextHint || 'retry' };
    }
    const h = lastHelpDay(q);
    if (h && h >= dayKey()) return { stage: 'help', text: 'Solved with help today. Retry from scratch on a later study day to prove it’s yours.', tab: 'retry' };
    return { stage: 'help', text: 'Retry from scratch with all help closed.', tab: 'retry' };
  }
  if (!stageState(q, 'evaluate')) return { stage: 'evaluate', text: 'Get your handwritten working evaluated line by line.' };
  if (!q.patternIds.length) return { stage: 'pattern', text: 'Learn to recognise this question’s pattern.' };
  if (!stageState(q, 'variations')) return { stage: 'variations', text: 'Practise fresh variations of the concept.' };
  if (isDue(q)) return { stage: 'history', text: 'Revision is due. Solve it again before looking at your notes.', review: true };
  if (!q.revision.nextReviewAt) return { stage: 'history', text: 'Schedule this question for revision.' };
  return { stage: 'history', text: `Next revision ${relDay(q.revision.nextReviewAt)} (${fmtDay(q.revision.nextReviewAt)}).` };
}

/* ---------------------------------------------------------------------
   Revision scheduling (PrepBoard's 1/3/7/21/45 ladder, made responsive)
   --------------------------------------------------------------------- */
function ensureScheduled(q) {
  if (!q.revision.nextReviewAt && !q.revision.history.length) {
    q.revision.stage = 0;
    q.revision.nextReviewAt = addDays(dayKey(), S.settings.intervals[0]);
  }
}
/* result: 'independent' | 'answer-only' | 'peeked' | 'failed'. method/reason: yes|partly|no. felt: easy|ok|hard */
function applyRevision(q, rec) {
  const iv = S.settings.intervals;
  const today = dayKey();
  const prevStage = q.revision.stage || 0;
  let stage = prevStage, gap;
  const full = rec.result === 'independent' && rec.method === 'yes' && rec.reason === 'yes';
  if (rec.result === 'independent') {
    stage = full ? prevStage + 1 : prevStage;
    gap = stage < iv.length ? iv[stage] : S.settings.maintenanceDays;
    if (rec.felt === 'hard') gap = Math.max(1, Math.round(gap * 0.6));
    if (rec.felt === 'easy' && full) gap = Math.round(gap * 1.3);
  } else if (rec.result === 'peeked') {
    gap = Math.max(1, Math.floor((iv[Math.min(stage, iv.length - 1)] || 1) / 2));
  } else if (rec.result === 'answer-only') {
    stage = Math.max(0, prevStage - 1); gap = 1;
  } else {
    stage = 0; gap = 1;
  }
  // "Delayed recall" only counts when solved independently at least 3 days after the last solve or review.
  const lastSolveDay = [...q.attempts.filter(isSolved).map(a => a.day), ...q.revision.history.map(h => h.day)].sort().pop();
  const delay = lastSolveDay ? daysBetween(lastSolveDay, today) : 0;
  const counts = rec.result === 'independent' && !rec.revealedFirst && delay >= 3;
  const entry = { id: uid('rev'), at: nowISO(), day: today, ...rec, delayDays: delay, counts, stageBefore: prevStage, stageAfter: stage, gapDays: gap };
  q.revision.history.push(entry);
  q.revision.stage = stage;
  q.revision.nextReviewAt = addDays(today, gap);
  // Two weak revisions in a row send you back to the concept lesson.
  const recent = q.revision.history.slice(-2);
  q.relearn = recent.length === 2 && recent.every(h => h.result === 'failed' || h.result === 'answer-only');
  if (rec.result === 'independent' && full) q.relearn = false;
  return entry;
}

/* ---------------------------------------------------------------------
   Syllabus coverage from evidence
   --------------------------------------------------------------------- */
function topicStats() {
  const map = {};
  const qs = qList();
  for (const t of topicIndex().list) map[t.id] = { qs: [], state: 0, flags: [], why: '' };
  for (const q of qs) for (const id of q.syllabusLinks) if (map[id]) map[id].qs.push(q);
  const today = dayKey();
  for (const [id, m] of Object.entries(map)) {
    const note = S.topicNotes[id] || {};
    const qsT = m.qs;
    const levels = qsT.map(questionLevel);
    const indepCount = levels.filter(l => l >= 3).length;
    const retained = levels.filter(l => l >= 4).length;
    const lastRevFailed = qsT.some(q => { const h = q.revision.history[q.revision.history.length - 1]; return h && (h.result === 'failed' || h.result === 'answer-only'); });
    const overdue = qsT.some(q => q.revision.nextReviewAt && q.revision.nextReviewAt < today);
    const gapWork = qsT.some(q => (usedTask(q, 'diagnose') || usedTask(q, 'theory')) && questionLevel(q) < 3);
    const attempted = qsT.some(q => q.attempts.length);
    const learned = qsT.some(q => interactionsOf(q, 'learn').some(hasReply));
    let state = 0, why = 'No linked question and not marked as theory study.';
    if (note.theory) { state = 1; why = 'You marked this subtopic as being studied in theory.'; }
    if (learned) { state = 1; why = 'A concept lesson is saved for a linked question.'; }
    if (attempted) { state = 2; why = `${plural(qsT.filter(q => q.attempts.length).length, 'linked question')} attempted, none solved independently yet.`; }
    if (gapWork) { state = 3; why = 'A diagnosis or missing-theory lesson is open on a linked question that is not yet solved independently.'; }
    if (indepCount) { state = 4; why = `${plural(indepCount, 'linked question')} solved independently; Strong needs 2+ independent solves and 1+ delayed recall.`; }
    if (indepCount >= 2 && retained >= 1) { state = 6; why = `${indepCount} linked questions solved independently and ${retained} recalled after a delay.`; }
    if (attempted && (lastRevFailed || overdue)) { state = 5; why = lastRevFailed ? 'The latest revision of a linked question failed or only recalled the final value.' : 'A linked question is overdue for revision.'; }
    const flags = [];
    const conceptualMistakes = qsT.reduce((n, q) => n + q.mistakes.filter(x => CONCEPTUAL.has(x.type)).length, 0);
    if (conceptualMistakes >= 2) flags.push(['bad', `${conceptualMistakes} conceptual mistakes`]);
    const helped = qsT.filter(q => ['hint1', 'hint2', 'hint3'].some(t => usedTask(q, t))).length;
    if (qsT.length >= 2 && helped / qsT.length >= 0.5) flags.push(['l2', `hints on ${helped}/${qsT.length}`]);
    const revFails = qsT.reduce((n, q) => n + q.revision.history.filter(h => h.result === 'failed' || h.result === 'answer-only').length, 0);
    if (revFails) flags.push(['bad', `${plural(revFails, 'failed revision')}`]);
    Object.assign(m, { state, why, flags, indepCount, retained, conceptualMistakes, helped, revFails });
  }
  return map;
}

/* ---------------------------------------------------------------------
   Dashboard metrics — every number is a count of recorded events
   --------------------------------------------------------------------- */
function metrics() {
  const qs = qList();
  const stats = topicStats();
  const ee = topicIndex().list.filter(t => t.area === 'EE'), ga = topicIndex().list.filter(t => t.area === 'GA');
  const covered = arr => arr.filter(t => stats[t.id].qs.some(q => q.attempts.length)).length;
  const touched = arr => arr.filter(t => stats[t.id].state > 0).length;
  const indepT = arr => arr.filter(t => stats[t.id].state >= 4 && stats[t.id].indepCount > 0).length;
  const firsts = qs.map(q => q.attempts.find(a => a.kind === 'first')).filter(Boolean);
  const retries = qs.flatMap(q => q.attempts.filter(a => a.kind === 'retry'));
  const retriesCounted = retries.filter(a => a.indep || !isSolved(a));
  const levels = qs.map(questionLevel);
  const revs = qs.flatMap(q => q.revision.history);
  const variations = qs.flatMap(q => q.variations);
  const gapTopics = Object.entries(stats).filter(([, m]) => m.flags.length).map(([id, m]) => ({ id, m })).sort((a, b) => (b.m.conceptualMistakes + b.m.revFails + b.m.helped) - (a.m.conceptualMistakes + a.m.revFails + a.m.helped));
  const mistakeCounts = {};
  qs.forEach(q => q.mistakes.forEach(m => { mistakeCounts[m.type] = (mistakeCounts[m.type] || 0) + 1; }));
  return {
    eeTotal: ee.length, eeCovered: covered(ee), eeTouched: touched(ee), eeIndep: indepT(ee),
    gaTotal: ga.length, gaCovered: covered(ga), gaTouched: touched(ga),
    qTotal: qs.length, attempted: qs.filter(q => q.attempts.length).length,
    firstTotal: firsts.length, firstSolved: firsts.filter(a => isSolved(a) && a.indep).length,
    retryTotal: retriesCounted.length, retrySolved: retries.filter(a => a.indep && isSolved(a)).length,
    sameDayRepro: retries.filter(a => isSolved(a) && !a.indep).length,
    withHelp: levels.filter(l => l === 2).length, independent: levels.filter(l => l >= 3).length, retained: levels.filter(l => l === 4).length,
    due: qs.filter(isDue).length,
    revTotal: revs.length, revRecall: revs.filter(h => h.counts).length,
    patterns: Object.keys(S.patterns).length,
    varTotal: variations.length, varTried: variations.filter(v => v.status && v.status !== 'not-tried').length, varSolved: variations.filter(v => v.status === 'solved').length,
    gapTopics, mistakeCounts, stats,
  };
}

/* ---------- daily plan: finish every portal PYQ by the target date ----------
   A question counts as completed on the study day of its first logged attempt.
   Study days start at settings.dayStartHour (4:00 AM by default), so work done
   at 2 AM still belongs to the previous day. */
function firstAttemptDay(q) { return q.attempts.length ? q.attempts.reduce((m, a) => (!m || a.day < m ? a.day : m), '') : null; }
/* A goal = some portal subjects + an end date. Several goals can run at once
   (e.g. Networks by 15 Nov, Machines by 20 Dec); today's target is their sum. */
function planGoals() {
  if (!Array.isArray(S.settings.goals)) {
    S.settings.goals = S.settings.targetDate ? [{ id: uid('goal'), subjects: PORTAL.map(x => x[0]), end: S.settings.targetDate }] : [];
  }
  return S.settings.goals;
}
function planFor(goal) {
  const today = dayKey();
  const subs = new Set(goal.subjects);
  const total = PORTAL.filter(x => subs.has(x[0])).reduce((n, x) => n + x[1], 0);
  const days = qList().filter(q => subs.has(q.pyq.subject)).map(firstAttemptDay).filter(Boolean);
  const doneBefore = days.filter(d => d < today).length;
  const doneToday = days.filter(d => d === today).length;
  const done = doneBefore + doneToday;
  const out = { goal, total, done, doneToday, doneBefore, left: Math.max(0, total - done), daysLeft: null, perDay: 0, todayLeft: 0, status: 'unset' };
  if (!goal.end || !goal.subjects.length) return out;
  out.daysLeft = daysBetween(today, goal.end) + 1;          // today and the end day both count
  if (out.daysLeft < 1) { out.status = 'passed'; return out; }
  out.perDay = Math.ceil(Math.max(0, total - doneBefore) / out.daysLeft); // fixed for the whole study day
  out.todayLeft = Math.max(0, out.perDay - doneToday);
  out.status = out.left === 0 ? 'finished' : out.todayLeft === 0 ? 'met' : 'on';
  return out;
}
function todayPlan() {
  const plans = planGoals().map(planFor);
  const live = plans.filter(p => p.status === 'on' || p.status === 'met' || p.status === 'finished');
  return {
    plans, live,
    perDay: live.reduce((n, p) => n + p.perDay, 0),
    doneToday: live.reduce((n, p) => n + Math.min(p.doneToday, p.perDay || p.doneToday), 0),
    doneTodayAll: live.reduce((n, p) => n + p.doneToday, 0),
    todayLeft: live.reduce((n, p) => n + p.todayLeft, 0),
  };
}
const subjShort = n => PORTAL_SHORT[n] || n;
function goalName(g) {
  if (g.subjects.length === PORTAL.length) return 'All subjects';
  return g.subjects.map(subjShort).join(', ') || 'No subjects';
}
/* ---------- plan editor (modal) ---------- */
function renderPlanEditor() {
  const d = UI.planDraft; const today = dayKey();
  const usedBy = {}; d.forEach((g, i) => g.subjects.forEach(x => { usedBy[x] = i; }));
  $('#modalBody').innerHTML = `<div class="stack" id="planForm">
    <p class="small">Each goal is a set of subjects and the date you want them finished. The app splits what is left into a daily number. Use one goal for everything, or one per subject with different dates.</p>
    ${d.length ? d.map((g, i) => { const pl = planFor(g); return `
    <div class="goal-ed">

/* ---------------------------------------------------------------------
   Reading replies back (we store the raw text unchanged; parsing only pre-fills forms)
   --------------------------------------------------------------------- */
const HEAD_RE = /^\s*(?:#{1,6}\s*)?(?:\*\*)?\s*(\d{1,2})[.)]\s+([A-Z][A-Z0-9 ,&'’\/()\-–—]+?)\s*(?:\*\*)?\s*(?::\s*(.*))?$/;
function parseNumberedSections(text) {
  const out = {};
  let cur = null;
  for (const raw of String(text || '').replace(/\r\n?/g, '\n').split('\n')) {
    const line = raw.replace(/\*\*/g, '');
    const m = HEAD_RE.exec(line);
    if (m && (m[2].match(/[A-Z]/g) || []).length >= 4) {
      cur = +m[1];
      out[cur] = m[3] ? m[3].trim() + '\n' : '';
      continue;
    }
    if (cur != null) out[cur] += raw + '\n';
  }
  for (const k of Object.keys(out)) out[k] = out[k].replace(/^\s+|\s+$/g, '');
  return out;
}
function patternFromReply(text) {
  const s = parseNumberedSections(text);
  const firstLine = t => String(t || '').split('\n').map(x => x.replace(/^[-•*]\s*/, '').trim()).filter(Boolean)[0] || '';
  return {
    name: firstLine(s[1]).replace(/^"|"$/g, '').slice(0, 120),
    archetype: s[2] || '', clues: s[3] || '', principle: s[4] || '', procedure: s[5] || '',
    assumptions: s[6] || '', limitations: s[7] || '', traps: s[8] || '', similar: s[9] || '',
    changes: s[10] || '', variations: s[11] || '', syllabusText: s[12] || '', hook: firstLine(s[13]).replace(/^"|"$/g, ''),
  };
}
function variationsFromReply(text) {
  const t = String(text || '').replace(/\r\n?/g, '\n');
  const cut = t.search(/^\s*(?:#{1,6}\s*)?(?:\*\*)?\s*(?:PART B\b|ANSWERS AND SOLUTIONS)/im);
  const qPart = cut >= 0 ? t.slice(0, cut) : t;
  const solutions = cut >= 0 ? t.slice(cut).trim() : '';
  const blocks = [];
  const re = /^\s*(?:#{1,6}\s*)?(?:\*\*)?\s*VARIATION\s+(\d+)\b.*$/gim;
  const idx = [];
  let m;
  while ((m = re.exec(qPart))) idx.push({ at: m.index, n: +m[1] });
  idx.forEach((v, i) => {
    const chunk = qPart.slice(v.at, i + 1 < idx.length ? idx[i + 1].at : undefined).trim();
    blocks.push({ n: v.n, text: chunk.replace(/\*\*/g, '') });
  });
  return { blocks, solutions };
}

/* Safe display of pasted replies: escape everything, then bold capitalised section titles. */
function renderReply(text) {
  let out = '';
  String(text || '').replace(/\r\n?/g, '\n').split('\n').forEach((line, i, arr) => {
    const plain = line.replace(/\*\*/g, '').replace(/^#{1,6}\s*/, '');
    const isHead = /^\s*(?:\d{1,2}[.)]\s+)?[A-Z][A-Z0-9 ,&'’\/()\-–—:]{3,}$/.test(plain.trim()) && (plain.match(/[A-Z]/g) || []).length >= 4 && plain.length < 100;
    out += isHead ? `<span class="rh">${esc(plain.trim())}</span>` : esc(line) + (i < arr.length - 1 ? '\n' : '');
  });
  return out;
}

   --------------------------------------------------------------------- */
function renderNav() {
  const due = qList().filter(isDue).length;
  const items = [
    ['dashboard', 'Dashboard', ''], ['pyq', 'PYQ Tracker', ''], ['q', 'Question Workspace', ''], ['syllabus', 'Syllabus Map', ''],
    ['patterns', 'Pattern Library', ''], ['revision', 'Revision', due ? `<span class="count" aria-label="${due} due">${due}</span>` : ''], ['settings', 'Settings & Backup', ''],
  ];
  $('#nav').innerHTML = items.map(([v, label, extra]) => `<a href="#/${v}" ${UI.route.view === v ? 'aria-current="page"' : ''}><span>${label}</span>${extra}</a>`).join('');
}
function rerender() {
  UI.route = parseHash();
  renderNav();
  if (DataFile.gate) $('#nav').innerHTML = '';
  const view = DataFile.gate ? viewGate : { dashboard: viewDashboard, pyq: viewPYQ, q: viewWorkspace, syllabus: viewSyllabus, patterns: viewPatterns, revision: viewRevision, settings: viewSettings }[UI.route.view] || viewDashboard;
  const main = $('#main');
  const y = window.scrollY;
  const active = document.activeElement && document.activeElement.id;
  main.innerHTML = (UI.banner ? `<div class="banner" role="alert">${esc(UI.banner)} <button class="btn small" data-act="dismissBanner">Dismiss</button></div>` : '') + view();
  window.scrollTo(0, y);
  if (active) { const el = document.getElementById(active); if (el) el.focus({ preventScroll: true }); }
  tickTimers();
}
function showBanner(msg) { UI.banner = msg; rerender(); }

/* ---------------------------------------------------------------------
   Shared bits
   --------------------------------------------------------------------- */
function levelPill(q) { const l = questionLevel(q); return `<span class="pill l${l}" title="${esc(LEVELS[l].why)}">${LEVELS[l].label}</span>`; }
function qName(q) { return q.title || (q.statement ? q.statement.split('\n')[0].slice(0, 70) : '') || q.pyq?.subtopic || q.pyq?.topic || 'Untitled question'; }
function sourceShort(q) { const s = q.source || {}; return [s.type === 'GATE EE PYQ' ? 'PYQ' : s.type, s.year, s.questionNumber ? 'Q' + String(s.questionNumber).replace(/^Q/i, '') : ''].filter(Boolean).join(' '); }
function choiceRow(name, opts, value, attrs = '', disabledSet = new Set()) {
  return `<div class="choices" role="group" aria-label="${esc(name)}">${opts.map(([v, l]) => `<button type="button" class="choice" data-act="choose" data-bind="${attrs}" data-value="${esc(v)}" aria-pressed="${value === v}" ${disabledSet.has(v) ? 'disabled' : ''}>${esc(l)}</button>`).join('')}</div>`;
}
function selectEl(bindAttr, opts, value, placeholder) {
  return `<select ${bindAttr}>${placeholder !== undefined ? `<option value="">${esc(placeholder)}</option>` : ''}${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(value) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
}
function openLLMLinks() {
  return `<a class="btn ghost small" href="https://chatgpt.com/" target="_blank" rel="noopener">Open ChatGPT</a><a class="btn ghost small" href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a><a class="btn ghost small" href="https://gemini.google.com/app" target="_blank" rel="noopener">Open Gemini</a>`;
}
/* ---------- per-question AI chat link ---------- */
function safeUrl(u) { return /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : ''; }
function chatHost(u) {
  try {
    const h = new URL(u).hostname.replace(/^www\./, '');
    if (/chatgpt\.com|openai\.com/.test(h)) return 'ChatGPT';
    if (/claude\.ai/.test(h)) return 'Claude';
    if (/gemini\.google\.com/.test(h)) return 'Gemini';
    return h;
  } catch { return 'AI'; }
}
function chatRow(q) {
  const u = safeUrl(q.chatUrl);
  return `<div class="row" style="margin-top:6px">
    <input type="url" data-chaturl="${esc(q.id)}" value="${esc(q.chatUrl || '')}" placeholder="AI chat link for this question (paste it after your first prompt)" aria-label="AI chat link for this question" style="flex:1;min-width:220px">
    ${u ? `<a class="btn small primary" href="${esc(u)}" target="_blank" rel="noopener">Open ${esc(chatHost(u))} chat</a>` : '<span class="small muted">Saved when you click away.</span>'}
  </div>`;
}
function chatButtons(q) {
  const u = safeUrl(q.chatUrl);
  if (u) return `<a class="btn small" href="${esc(u)}" target="_blank" rel="noopener">Open ${esc(q.id)} chat (${esc(chatHost(u))})</a>`;
  return `${openLLMLinks()}<span class="small muted">After starting a new chat, paste its link under the question title.</span>`;
}
/* ---------- editing a saved reply ---------- */
const snapReply = i => ({ at: nowISO(), response: i.response, verdict: i.verdict || '', takeaway: i.takeaway || '', followUp: i.followUp || '' });
function replyEditor(q, i) {
  const d = UI.editReply[i.id];
  return `<div class="stack" style="margin-top:8px">
    <label class="f">Reply text<textarea rows="14" id="edit-resp-${esc(i.id)}" data-ed="${esc(i.id)}|response">${esc(d.response)}</textarea></label>
    ${['evaluate', 'aptitude'].includes(i.task) ? `<label class="f">Verdict the tutor gave${selectEl(`data-ed="${esc(i.id)}|verdict"`, VERDICTS, d.verdict, 'Choose the verdict')}</label>` : ''}
    <div class="grid2">
      <label class="f">My takeaway in one line<input type="text" data-ed="${esc(i.id)}|takeaway" value="${esc(d.takeaway)}"></label>
      ${['diagnose', 'theory', 'evaluate'].includes(i.task) ? `<label class="f">Follow-up action<input type="text" data-ed="${esc(i.id)}|followUp" value="${esc(d.followUp)}"></label>` : ''}
    </div>
    <div class="row"><button class="btn primary" data-act="saveReplyEdit" data-id="${esc(q.id)}" data-iid="${esc(i.id)}">Save changes</button><button class="btn" data-act="cancelReplyEdit" data-iid="${esc(i.id)}">Cancel</button><span class="small muted">The current text is kept under “Earlier versions”.</span></div>
  </div>`;
}
function getUI(map, key, init) { if (!map[key]) map[key] = typeof init === 'function' ? init() : { ...init }; return map[key]; }

/* ---------------------------------------------------------------------
   Dashboard
   --------------------------------------------------------------------- */
function viewDashboard() {
  const M = metrics();
  const qs = qList();
  const today = dayKey();
  const startH = S.settings.dayStartHour;
  const inProgress = qs.filter(q => !nextAction(q).text.startsWith('Next revision'))
    .sort((a, b) => b.updatedAt.localeCompare(a.updatedAt)).slice(0, 5);
  const scores = [...S.scores].sort((a, b) => a.date.localeCompare(b.date));
  const recent = scores.slice(-10);
  const target = S.settings.targetMarks;
  const best = scores.length ? Math.max(...scores.map(s => (s.marks / (s.outOf || 100)) * 100)) : null;
  const last3 = scores.slice(-3);
  const avg3 = last3.length ? last3.reduce((n, s) => n + (s.marks / (s.outOf || 100)) * 100, 0) / last3.length : null;

  const hello = !qs.length ? `
    <div class="panel">
      <h2>Start with one question</h2>
      <p>Pick any GATE EE previous-year question and take a screenshot of it. Create a record here, then the app walks you through: learn the concept, attempt it, find the gap, get graded hints, check your working, learn the pattern, practise variations and revise.</p>
      <p class="muted small">Screenshots never go into this page. You attach them in ChatGPT, Claude or Gemini; this page writes the prompts and keeps your notes.</p>
      <button class="btn primary big" data-act="newQuestion">New question</button>
    </div>` : '';

  const P = todayPlan();
  const end = dayEndAt();
  const endLabel = end.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const streak = streakDays(), bestRun = bestStreak(), todayActive = !!S.activity[today];
  const strip = Array.from({ length: 14 }, (_, i) => addDays(today, i - 13)).map(k => `<i class="${S.activity[k] ? 'on' : ''} ${k === today ? 'now' : ''}" title="${esc(fmtDay(k))}: ${S.activity[k] ? plural(S.activity[k], 'learning action') : 'no activity'}"></i>`).join('');
  const goalRow = pl => `<li><span class="gn">${esc(goalName(pl.goal))}</span>${
      pl.status === 'passed' ? `<span class="muted">date passed, ${pl.left} left</span>`
      : pl.status === 'unset' ? '<span class="muted">not set</span>'
      : pl.status === 'finished' ? '<b class="ok">all done</b>'
      : `<span><b class="${pl.todayLeft ? '' : 'ok'}">${pl.doneToday}/${pl.perDay}</b> <span class="muted">· ${pl.left} left · by ${esc(fmtDay(pl.goal.end))}</span></span>`}</li>`;
  const goalBody = !P.plans.length ? `
      <p class="small">Choose the subjects and the date you want to finish them. The app works out how many questions to do each day.</p>
      <button class="btn primary" data-act="planEdit">Set up my plan</button>`
    : `
      ${P.live.length ? `<div class="plan-big"><span class="bigfig">${P.doneToday}<span class="of">/${P.perDay}</span></span><span class="small muted">questions today</span></div>
      <div class="meter" style="margin:8px 0"><i style="width:${P.perDay ? Math.min(100, (P.doneToday / P.perDay) * 100) : 100}%;background:var(--live)"></i></div>
      <p class="small" style="margin:0 0 6px">${P.todayLeft ? `<b>${plural(P.todayLeft, 'question')}</b> left for today.` : `<b>Today's target is done.</b> Extra work lowers tomorrow's number.`}</p>` : ''}
      <ul class="goal-list">${P.plans.map(goalRow).join('')}</ul>
      <button class="btn ghost small" data-act="planEdit">Edit subjects &amp; dates</button>`;
  const planPanel = `
  <div class="plan">
    <section class="panel">
      <h3>Today's target</h3>
      ${goalBody}
    </section>
    <section class="panel">
      <h3>Study day ends in</h3>
      <div class="bigfig mono" data-dayend>${fmtCountdown(end - new Date())}</div>
      <div class="meter" style="margin:8px 0" title="How much of the study day has passed"><i data-dayfill style="width:0;background:var(--amber)"></i></div>
      <p class="small muted" style="margin:0">Day ends at ${esc(endLabel)}. Work before then counts for ${esc(fmtDay(today))}.</p>
    </section>
    <section class="panel">
      <h3>Streak</h3>
      <div class="bigfig">${streak} <span class="of">${streak === 1 ? 'day' : 'days'}</span></div>
      <div class="streak" aria-label="Last 14 study days">${strip}</div>
      <p class="small muted" style="margin:0">${todayActive ? 'Today is counted.' : streak ? `Do one learning action before ${esc(endLabel)} to keep it.` : 'Log an attempt, hint or revision to start one.'} Best: ${plural(bestRun, 'day')}.</p>
    </section>
  </div>
  ${P.plans.length ? `<p class="small muted plan-line">A question counts as completed on the study day you log its first attempt, under its PYQ subject. Days left include today and the finish date.</p>` : ''}`;
  return `
  <div class="page-head">
    <div><h1>Today</h1><p>Study day ${esc(fmtDay(today))}, which began at ${pad(startH)}:00. ${S.activity[today] ? plural(S.activity[today], 'learning action') + ' recorded today' : 'Nothing recorded yet today'}${streakDays() > 1 ? `, ${streakDays()}-day streak` : ''}.</p></div>
    <div class="row">${M.due ? `<a class="btn" href="#/revision">Review ${plural(M.due, 'due question')}</a>` : ''}<a class="btn big" href="#/pyq">PYQ Tracker</a><button class="btn primary big" data-act="newQuestion">Add PYQ</button></div>
  </div>
  ${planPanel}
  ${hello}
  ${qs.length ? `
  <div class="today">
    <section class="panel continue">
      <h2>Continue where you left off</h2>
      ${inProgress.length ? `<ul>${inProgress.map(q => { const n = nextAction(q); return `<li><span class="qid">${esc(q.id)}</span><span style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(qName(q))}</b><span class="small muted">${esc(n.text)}</span></span><a class="btn small" href="${qLink(q.id, n.stage)}">Open</a></li>`; }).join('')}</ul>` : '<p class="muted">Every question is through its loop. Add a new one or practise variations.</p>'}
    </section>
    <section class="panel">
      <h2>Towards ${target} marks</h2>
      ${recent.length ? `
        <div class="bars" role="img" aria-label="Last ${recent.length} scores as percentages against a ${target} target">
          <div class="goal" style="bottom:${target}%" title="Target ${target}"></div>
          ${recent.map(s => { const p = Math.max(0, Math.min(100, (s.marks / (s.outOf || 100)) * 100)); return `<div class="b ${p >= target ? 'ok' : ''}" style="height:${p}%" title="${esc(s.label || s.kind)}: ${s.marks}/${s.outOf} on ${esc(s.date)}"></div>`; }).join('')}
        </div>
        <p class="small muted" style="margin-top:8px">Dashed line: ${target}/100. Last 3 average ${avg3 != null ? avg3.toFixed(1) : '—'}, best ${best != null ? best.toFixed(1) : '—'} (scaled to 100). A trend, not a prediction.</p>` : `<p class="muted small">Log timed practice or mock scores to see a trend against ${target}. Nothing here predicts your GATE result.</p>`}
      <details class="fold"><summary>Log a score</summary>
        <div class="grid3" style="margin-top:8px">
          <label class="f">Date<input type="date" id="scDate" value="${new Date().toISOString().slice(0, 10)}"></label>
          <label class="f">Marks<input type="number" id="scMarks" step="0.01" placeholder="e.g. 41.33"></label>
          <label class="f">Out of<input type="number" id="scOut" value="100"></label>
        </div>
        <div class="grid2" style="margin-top:8px">
          <label class="f">Kind${selectEl('id="scKind"', [['Full mock', 'Full mock'], ['Subject test', 'Subject test'], ['Timed PYQ set', 'Timed PYQ set']], 'Full mock')}</label>
          <label class="f">Label (optional)<input type="text" id="scLabel" placeholder="e.g. Mock 3"></label>
        </div>
        <div class="row" style="margin-top:8px"><button class="btn" data-act="addScore">Save score</button></div>
        ${scores.length ? `<div class="scroll-x" style="margin-top:10px"><table class="plain"><thead><tr><th>Date</th><th>Kind</th><th>Marks</th><th></th></tr></thead><tbody>${scores.slice().reverse().map(s => `<tr><td>${esc(s.date)}</td><td>${esc(s.label || s.kind)}</td><td>${s.marks}/${s.outOf}</td><td><button class="btn ghost small" data-act="delScore" data-id="${esc(s.id)}">Delete</button></td></tr>`).join('')}</tbody></table></div>` : ''}
      </details>
    </section>
  </div>

  <div class="ev" aria-label="Evidence">
    <section>
      <h3>Syllabus coverage</h3>
      <dl>
        <dt>EE subtopics with an attempted question</dt><dd>${M.eeCovered}/${M.eeTotal}</dd>
        <dt>EE subtopics solved independently</dt><dd>${M.eeIndep}</dd>
        <dt>EE subtopics not started</dt><dd>${M.eeTotal - M.eeTouched}</dd>
        <dt>General Aptitude attempted</dt><dd>${M.gaCovered}/${M.gaTotal}</dd>
      </dl>
      <p class="how">A subtopic counts only through questions you linked to it. One question never completes a chapter. <a href="#/syllabus">Open the map</a></p>
    </section>
    <section>
      <h3>Solving evidence</h3>
      <dl>
        <dt>Questions attempted</dt><dd>${M.attempted}/${M.qTotal}</dd>
        <dt>Independent first-attempt success</dt><dd>${M.firstSolved}/${M.firstTotal} <span class="muted">(${pct(M.firstSolved, M.firstTotal)})</span></dd>
        <dt>Independent retry success</dt><dd>${M.retrySolved}/${M.retryTotal} <span class="muted">(${pct(M.retrySolved, M.retryTotal)})</span></dd>
        <dt>Solved only with help</dt><dd>${M.withHelp}</dd>
      </dl>
      <p class="how">A retry counts as independent only on a later study day than your last lesson, hint or solution${M.sameDayRepro ? `; ${plural(M.sameDayRepro, 'same-day reproduction')} counted as help` : ''}.</p>
    </section>
    <section>
      <h3>Retention</h3>
      <dl>
        <dt>Revisions due now</dt><dd>${M.due}</dd>
        <dt>Revisions done</dt><dd>${M.revTotal}</dd>
        <dt>Delayed independent recalls</dt><dd>${M.revRecall}</dd>
        <dt>Questions retained</dt><dd>${M.retained}</dd>
      </dl>
      <p class="how">Recall counts when you solve it yourself, before revealing notes, 3+ days after the last solve.</p>
    </section>
    <section>
      <h3>Transfer</h3>
      <dl>
        <dt>Patterns collected</dt><dd>${M.patterns}</dd>
        <dt>Variations attempted</dt><dd>${M.varTried}/${M.varTotal}</dd>
        <dt>Variations solved on your own</dt><dd>${M.varSolved}</dd>
      </dl>
      <p class="how">Variations test whether the method transfers to a question you have not seen.</p>
    </section>
  </div>

  <div class="today" style="margin-top:14px">
    <section class="panel">
      <h2>Recurring gaps</h2>
      ${M.gapTopics.length ? `<div class="scroll-x"><table class="plain"><thead><tr><th>Subtopic</th><th>Evidence</th></tr></thead><tbody>${M.gapTopics.slice(0, 8).map(({ id, m }) => `<tr><td><a href="#/q?topic=${encodeURIComponent(id)}">${esc(topicLabel(id))}</a></td><td>${m.flags.map(f => `<span class="pill ${f[0]}">${esc(f[1])}</span>`).join(' ')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small">Appears once a subtopic has 2+ conceptual mistakes, hints on half its questions, or a failed revision. Link questions to syllabus subtopics so gaps can show up here.</p>'}
      ${Object.keys(M.mistakeCounts).length ? `<p class="small" style="margin-top:10px"><b>Mistake types so far:</b> ${Object.entries(M.mistakeCounts).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${esc(MISTAKE_LABEL[k] || k)} ${n}`).join(', ')}</p>` : ''}
    </section>
    <section class="panel">
      <h2>GATE 2027 EE paper</h2>
      <p class="small">${esc(PAPER_PATTERN.questions)}. ${esc(PAPER_PATTERN.marks)}. ${esc(PAPER_PATTERN.duration)}. ${esc(PAPER_PATTERN.types)}.</p>
      <p class="small">${esc(PAPER_PATTERN.negative)}</p>
      <p class="small muted">Source: <a href="${PAPER_PATTERN.source}" target="_blank" rel="noopener">official question paper pattern</a>. Section-wise weightage beyond this is not published, so none is assumed here.</p>
    </section>
  </div>` : ''}`;
}

/* ---------------------------------------------------------------------
   Question workspace
   --------------------------------------------------------------------- */
function filteredQuestions() {
  const s = UI.search.trim().toLowerCase();
  return qList().filter(q => {
    if (UI.topicFilter && !q.syllabusLinks.includes(UI.topicFilter)) return false;
    if (UI.pyqFilter && !(pyqKey(...pyqPath(q)) + ' › ').startsWith(UI.pyqFilter + ' › ')) return false;
    const f = UI.listFilter, l = questionLevel(q);
    if (f === 'due' && !isDue(q)) return false;
    if (f === 'progress' && l >= 3) return false;
    if (f === 'help' && l !== 2) return false;
    if (f === 'indep' && l < 3) return false;
    if (!s) return true;
    const hay = [q.id, q.title, q.statement, q.topicGuess, sourceLine(q), ...pyqPath(q), ...q.tags, ...q.concepts, q.takeaway, ...q.syllabusLinks.map(topicLabel)].join(' ').toLowerCase();
    return s.split(/\s+/).every(w => hay.includes(w));
  }).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
}
function renderQList(currentId) {
  const list = filteredQuestions();
  return `<aside class="qlist">
    <div class="row"><button class="btn primary" data-act="newQuestion" style="flex:1;justify-content:center">New question</button></div>
    <input type="search" id="qSearch" placeholder="Search ID, title, topic, notes" value="${esc(UI.search)}" aria-label="Search questions">
    ${selectEl('id="qFilter" aria-label="Filter questions"', [['all', 'All questions'], ['progress', 'Not yet solved on my own'], ['help', 'Solved with help'], ['indep', 'Solved independently'], ['due', 'Due for revision']], UI.listFilter)}
    ${UI.topicFilter ? `<div class="note small">Topic: ${esc(topicLabel(UI.topicFilter))} <button class="btn ghost small" data-act="clearTopicFilter">Clear</button></div>` : ''}
    ${UI.pyqFilter ? `<div class="note small">PYQ: ${esc(UI.pyqFilter)} <button class="btn ghost small" data-act="clearPyqFilter">Clear</button></div>` : ''}
    <div class="items" role="list">
      ${list.length ? list.map(q => `<a role="listitem" class="qitem" href="${qLink(q.id)}" ${q.id === currentId ? 'aria-current="true"' : ''}>
        <span class="t">${esc(qName(q))}</span>
        <span class="m"><span class="qid">${esc(q.id)}</span>${sourceShort(q) ? `<span>${esc(sourceShort(q))}</span>` : ''}${q.pyq.subject ? `<span>${esc(PORTAL_SHORT[q.pyq.subject] || q.pyq.subject)}</span>` : ''}${levelPill(q)}${isDue(q) ? '<span class="pill due">due</span>' : ''}</span>
      </a>`).join('') : `<div class="empty" style="padding:16px"><p>${qList().length ? 'No question matches this search or filter.' : 'No questions yet.'}</p></div>`}
    </div>
    <p class="small muted">${plural(list.length, 'question')} shown</p>
  </aside>`;
}

function viewWorkspace() {
  const r = UI.route;
  if (r.params?.topic) UI.topicFilter = r.params.topic;
  if (r.params?.pyq) UI.pyqFilter = r.params.pyq;
  const q = r.id ? getQ(r.id) : null;
  if (r.id && !q) return `<div class="ws">${renderQList(null)}<div class="wsmain panel"><h2>${esc(r.id)} doesn’t exist</h2><p>It may have been deleted or not imported yet.</p><a class="btn" href="#/q">Back to all questions</a></div></div>`;
  if (!q) {
    return `<div class="ws">${renderQList(null)}<div class="wsmain"><div class="panel empty">
      <h3>Choose a question or create one</h3>
      <p>Each question keeps its whole journey in one record: lessons, attempts, hints, evaluations, patterns, variations and revisions.</p>
      <button class="btn primary" data-act="newQuestion">New question</button></div></div></div>`;
  }
  let stage = r.stage && STAGE_IDS.includes(r.stage) ? r.stage : q.currentStage;
  if (q.currentStage !== stage) { q.currentStage = stage; commit({ render: false }); }
  const na = nextAction(q);
  const panels = { learn: stageLearn, attempt: stageAttempt, help: stageHelp, evaluate: stageEvaluate, pattern: stagePattern, variations: stageVariations, history: stageHistory };
  return `<div class="ws has-q">${renderQList(q.id)}
  <div class="wsmain">
    <a class="btn ghost small" href="#/q" style="margin-bottom:6px">All questions</a>
    <div class="qhead">
      <div style="flex:1;min-width:240px">
        <div class="row"><span class="qid">${esc(q.id)}</span>${sourceShort(q) ? `<span class="tag">${esc(sourceShort(q))}</span>` : ''}${pyqPath(q).length ? `<a class="tag" href="#/q?pyq=${encodeURIComponent(pyqKey(...pyqPath(q)))}" title="${esc(pyqKey(...pyqPath(q)))}">${esc(pyqPath(q).slice(-1)[0])}</a>` : ''}${levelPill(q)}${isDue(q) ? '<span class="pill due">revision due</span>' : ''}${q.relearn && !isGA(q) ? '<span class="pill bad" title="Two weak revisions in a row">faded in revision</span>' : ''}</div>
        <input class="title" type="text" data-qfield="title" value="${esc(q.title)}" placeholder="Untitled — add a short name (optional)" aria-label="Question title">
        ${chatRow(q)}
      </div>
      <div class="row"><button class="btn small" data-act="exportOne" data-id="${esc(q.id)}">Export this question</button></div>
    </div>
    ${renderDetails(q)}
    ${isGA(q) ? stageGA(q) : `${renderTrace(q, stage)}
    <div class="nextbar" role="status"><span><b>Next:</b> ${esc(na.text)}</span>${na.stage !== stage || na.tab ? `<button class="btn small" data-act="goNext" data-id="${esc(q.id)}" data-stage="${na.stage}" data-tab="${na.tab || ''}" data-review="${na.review ? 1 : ''}">Go</button>` : ''}</div>
    ${panels[stage](q)}`}
  </div></div>`;
}

function renderTrace(q, current) {
  const st = STAGES.map(s => stageState(q, s.id));
  return `<nav class="trace" aria-label="Learning stages">${STAGES.map((s, i) => {
    const cls = [st[i] === 'done' ? 'done' : '', st[i] === 'skip' ? 'skip' : '', i > 0 && st[i - 1] && st[i] ? 'done-left' : ''].join(' ');
    const mark = st[i] === 'done' ? '✓' : st[i] === 'skip' ? '–' : String(i + 1);
    return `<button class="node ${cls}" data-act="stage" data-id="${esc(q.id)}" data-stage="${s.id}" ${s.id === current ? 'aria-current="step"' : ''} title="${st[i] === 'done' ? 'Done' : st[i] === 'skip' ? 'Not needed' : 'Not done yet'}"><span class="term" aria-hidden="true">${mark}</span><span class="lbl">${esc(s.label)}</span><span class="sr">${st[i] === 'done' ? ' (done)' : st[i] === 'skip' ? ' (not needed)' : ''}</span></button>`;
  }).join('')}</nav>`;
}

function renderDetails(q) {

        <label class="f">PYQ sub-topic${selectEl('data-qfield="pyq.subtopic"', (portalTopic(q.pyq.subject, q.pyq.topic)?.[2] || []).map(x => [x[0], x[0]]), q.pyq.subtopic, q.pyq.topic ? 'Choose sub-topic' : 'Pick a topic first')}</label>

        <label class="f">Question no.<input type="text" data-qfield="source.questionNumber" value="${esc(s.questionNumber)}" placeholder="e.g. 23"></label>
      </div>
      <div class="grid3">

        <label class="f">Marks${selectEl('data-qfield="marks"', [['1', '1 mark'], ['2', '2 marks']], q.marks ?? '', 'Not recorded')}</label>
        <label class="f">Official answer key (used only in solution and evaluation prompts)<input type="text" data-qfield="officialAnswer" value="${esc(q.officialAnswer)}" placeholder="e.g. 2.5 to 2.7 / (B)"></label>

      </div>
